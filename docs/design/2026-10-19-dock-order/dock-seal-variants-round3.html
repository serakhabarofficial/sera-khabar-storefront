<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dock contact seal — variants (round 3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Galada&family=Geist:wght@100..900&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --royal: #5b2d17; --deep: #4a2212; --sun: #f6b826; --pink: #e2547a; --ink: #3a1d0f; --sub: #7a6050;
    --dock-ic: #9a6a52; --hair: #ecd6c8; --wa: #25d366; --butter: #fff6df; --memo: #fffaf1;
    --out: cubic-bezier(0.23, 1, 0.32, 1);
    --drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --pop: cubic-bezier(0.34, 1.36, 0.64, 1);
    --disp: "Noto Serif Bengali", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: #e9e4dd; font-family: "Geist", "Noto Sans Bengali", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .num { font-family: "Noto Serif Bengali", serif; font-variant-numeric: tabular-nums; }

  /* Harness */
  #stage { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 84px 16px 40px; }
  .cap { max-width: 420px; text-align: center; }
  .cap b { display: block; font-family: var(--disp); font-weight: 900; font-size: 18px; color: var(--royal); }
  .cap > span { display: block; margin-top: 4px; font-size: 13.5px; line-height: 1.6; color: var(--sub); }
  .tray { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; }
  .tray small { width: 100%; font-size: 12px; color: var(--sub); }
  .tray button { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: #fff; color: var(--royal);
    box-shadow: inset 0 0 0 1px var(--hair); transition: background-color 160ms ease, color 160ms ease, transform 160ms var(--out); }
  .tray button:active { transform: scale(0.94); }
  .tray button[aria-pressed="true"] { background: var(--royal); color: var(--sun); box-shadow: none; }
  .tray svg { width: 20px; height: 20px; }
  .phone { position: relative; width: 390px; height: 800px; border-radius: 46px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 10px #1d1410, 0 0 0 11px #3b2c25, 0 40px 80px -30px rgba(29, 20, 16, 0.6); isolation: isolate; }
  @media (max-width: 480px) {
    #stage { padding: 0; gap: 0; }
    .cap { display: none; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
  .scroller { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }

  /* Product page (current, without the phone/WhatsApp row) */
  .ann { padding: 9px 16px; text-align: center; font-size: 12.5px; color: var(--sub); border-bottom: 1px solid var(--hair); }
  .ann b { color: var(--royal); }
  .hd { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 58px; padding: 0 16px; border-bottom: 1px solid var(--hair); }
  .hd .menu { display: grid; gap: 5px; width: 22px; } .hd .menu i { display: block; height: 1.4px; background: var(--royal); } .hd .menu i + i { width: 14px; }
  .hd .logo { font-family: var(--disp); font-weight: 900; font-size: 21px; color: var(--royal); }
  .hd .bag { justify-self: end; font-size: 13px; font-weight: 600; color: var(--royal); }
  .crumb { display: flex; gap: 7px; padding: 14px 16px 10px; font-size: 12.5px; color: var(--sub); }
  .photo { position: relative; margin: 0 16px; border-radius: 22px; background: #f7f1e8; aspect-ratio: 1; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chip { position: absolute; top: 14px; left: 14px; padding: 5px 12px; border-radius: 999px; background: #fff; font-family: var(--disp); font-weight: 700; font-size: 12px; color: var(--royal); }
  .info { display: flex; flex-direction: column; gap: 16px; padding: 22px 16px 0; }
  .info h1 { margin: 0; font-family: var(--disp); font-weight: 900; font-size: 34px; line-height: 1.25; color: var(--royal); }
  .ticks { margin: -4px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
  .ticks li::before { content: "✓"; margin-right: 8px; color: var(--pink); font-weight: 700; }
  .price { font-size: 30px; font-weight: 700; color: var(--royal); }
  .lbl { display: block; margin-bottom: 8px; font-family: var(--disp); font-weight: 700; font-size: 14px; color: var(--royal); }
  .sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .size { display: flex; align-items: center; gap: 10px; padding: 14px 12px; border-radius: 18px; text-align: left; box-shadow: inset 0 0 0 1.5px rgba(58, 29, 15, 0.16); }
  .size[aria-pressed="true"] { background: var(--butter); box-shadow: inset 0 0 0 2px var(--royal); }
  .size b { display: block; font-family: var(--disp); font-weight: 900; font-size: 17px; color: var(--royal); }
  .size .num { font-size: 15px; color: var(--royal); }
  .buyrow { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
  .qty { display: inline-flex; align-items: center; height: 56px; padding: 0 6px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px rgba(58, 29, 15, 0.16); }
  .qty button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--royal); }
  .qty output { min-width: 26px; text-align: center; font-size: 18px; }
  .cod { display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 999px; background: var(--sun); font-weight: 700; font-size: 16px; }
  .cod i { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); }
  .cartbtn { height: 56px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--royal); font-weight: 700; font-size: 15px; color: var(--royal); }
  .strip { margin: 30px 0 0; padding: 12px 0; overflow: hidden; white-space: nowrap; background: var(--royal); color: #fff; font-family: var(--disp); font-weight: 700; font-size: 14px; }
  .strip span { margin: 0 14px; } .strip span::after { content: "✦"; margin-left: 28px; color: var(--sun); }
  .details { padding: 28px 16px 0; }
  .details h2 { margin: 0 0 12px; font-family: var(--disp); font-weight: 900; font-size: 24px; color: var(--royal); }
  .memo { padding: 18px; border-radius: 18px; background: var(--memo); box-shadow: inset 0 0 0 1px var(--hair); font-size: 14px; line-height: 1.75; }
  .memo p { margin: 0 0 10px; }
  .memo .row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px dashed rgba(58, 29, 15, 0.2); }
  .memo .row em { font-style: normal; color: var(--pink); font-weight: 700; }
  .more { padding: 30px 16px 140px; }
  .more h2 { margin: 0 0 12px; font-family: var(--disp); font-weight: 900; font-size: 22px; color: var(--royal); }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { border-radius: 18px; background: #f7f1e8; aspect-ratio: 0.8; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; }
  .card b { font-family: var(--disp); font-weight: 900; font-size: 15px; color: var(--royal); }
  .card span { font-size: 13px; color: var(--sub); }

  /* Dock: হোম · মেনু · [সিল] · খুঁজুন · ব্যাগ — the seal sits exactly in the middle */
  .dock { position: absolute; z-index: 30; left: 12px; right: 12px; bottom: 14px; }
  .pill { position: relative; z-index: 2; height: 60px; padding: 5px; display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: center; gap: 2px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.86); -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid var(--hair); box-shadow: 0 10px 30px -12px rgba(74, 34, 18, 0.28); }
  .it { position: relative; height: 48px; display: grid; place-items: center; border-radius: 999px; color: var(--dock-ic); }
  .it svg { width: 22px; height: 22px; }
  .bagb { position: relative; justify-self: end; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 999px; background: var(--deep); color: #fff; }
  .bagb svg { width: 21px; height: 21px; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; display: grid; place-items: center; border-radius: 999px;
    background: #f08a1c; color: #fff; box-shadow: 0 0 0 2px #fff; font-family: var(--disp); font-weight: 600; font-size: 12.5px; }
  .press { transition: transform 160ms var(--out); }
  .press:active { transform: scale(0.97); }
  .scrim { position: absolute; inset: 0; z-index: 25; background: rgba(58, 29, 15, 0.24); opacity: 0; pointer-events: none; transition: opacity 220ms ease; }
  .phone.open .scrim { opacity: 1; pointer-events: auto; }
  .wa-ic { width: 20px; height: 20px; filter: brightness(0) invert(1); }

  /* The seal — shared by every variant; colours come from each variant */
  .seal { position: absolute; z-index: 4; left: 50%; top: 50%; width: 66px; height: 66px; margin: -41px 0 0 -33px; transition: transform 320ms var(--out); }
  .seal-pop { position: absolute; inset: 0; animation: seal-in 620ms var(--out) 420ms both; }
  @keyframes seal-in { from { transform: scale(0.4) rotate(-120deg); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
  .seal-btn { position: absolute; inset: 0; display: grid; place-items: center; color: var(--seal-ic); }
  .seal-btn svg.shape { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
    filter: drop-shadow(0 8px 12px rgba(74, 34, 18, 0.34)); transform: rotate(var(--r0, 0deg)); transition: transform 460ms var(--out); }
  .phone:not(.open) .seal-btn:active svg.shape { transform: rotate(calc(var(--r0, 0deg) + 14deg)) scale(0.94); transition-duration: 180ms; }
  .phone.open .seal-btn svg.shape { transform: rotate(calc(var(--r0, 0deg) + 77deg)); }
  .ci, .cx { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity 160ms ease, transform 260ms var(--out); }
  .ci svg { width: 27px; height: 27px; }
  .cx { opacity: 0; transform: rotate(-70deg) scale(0.5); }
  .phone.open .ci { opacity: 0; transform: rotate(70deg) scale(0.5); }
  .phone.open .cx { opacity: 1; transform: none; }

  /* ——— 1 · পাখা / Fan: a medallion; two tilted order cards fan out of it ——— */
  .v1 { --seal-ic: var(--sun); }
  .fp { position: absolute; z-index: 3; left: 50%; bottom: 80px; width: 162px; height: 60px; margin-left: -81px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 9px;
    border-radius: 22px; color: #fff; box-shadow: 0 16px 30px -14px rgba(58, 29, 15, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    opacity: 0; pointer-events: none; transform: translateY(46px) scale(0.3); transition: transform 200ms var(--out), opacity 140ms ease; }
  .fp.call { background: var(--royal); transform-origin: 100% 100%; }
  .fp.wa { background: #1fae55; transform-origin: 0 100%; }
  .fp .ico { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 15px; background: rgba(255, 255, 255, 0.16); }
  .fp span { display: grid; line-height: 1.25; } .fp b { font-family: var(--disp); font-weight: 700; font-size: 15px; } .fp small { font-size: 12px; opacity: 0.85; }
  .phone.open .fp { opacity: 1; pointer-events: auto; transition: transform 440ms var(--pop), opacity 180ms ease; }
  .phone.open .fp.call { transform: translate(-86px, -14px) rotate(-5deg); }
  .phone.open .fp.wa { transform: translate(86px, -14px) rotate(5deg); transition-delay: 55ms; }

  /* ——— 2 · কার্ড / Card: the old telephone rings, then a card opens out of the seal in a circle ——— */
  .v2 { --seal-ic: var(--butter); }
  .phone.open .v2 .ci svg { animation: ring 460ms ease-in-out; }
  .phone.open .v2 .ci, .phone.open .v2 .cx { transition-delay: 300ms; }
  @keyframes ring { 0%, 100% { transform: rotate(0); } 14% { transform: rotate(-18deg); } 28% { transform: rotate(15deg); } 42% { transform: rotate(-12deg); } 57% { transform: rotate(9deg); } 71% { transform: rotate(-5deg); } }
  .cr { position: absolute; z-index: 3; left: 0; right: 0; bottom: 84px; padding: 20px 18px 8px; border-radius: 28px; background: var(--memo);
    border: 1px solid var(--hair); box-shadow: 0 30px 60px -24px rgba(74, 34, 18, 0.5);
    clip-path: circle(0px at 50% calc(100% + 46px)); visibility: hidden; transition: clip-path 220ms var(--out), visibility 0s linear 220ms; }
  .phone.open .cr { clip-path: circle(150% at 50% calc(100% + 46px)); visibility: visible; transition: clip-path 520ms var(--drawer) 120ms, visibility 0s 120ms; }
  .m-in { opacity: 0; transform: translateY(10px); transition: opacity 120ms ease, transform 120ms var(--out); }
  .phone.open .m-in { opacity: 1; transform: none; transition: opacity 240ms ease 220ms, transform 300ms var(--out) 220ms; }
  .phone.open .m-row.r1 { transition-delay: 270ms; } .phone.open .m-row.r2 { transition-delay: 320ms; }
  .m-head { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 12px; border-bottom: 2px solid var(--royal); }
  .m-head b { display: block; font-family: var(--disp); font-weight: 900; font-size: 23px; color: var(--royal); line-height: 1.2; }
  .m-head small { display: block; font-size: 12.5px; color: var(--sub); }
  .m-head .script { font-family: "Galada", cursive; font-size: 18px; color: var(--pink); transform: rotate(-4deg); }
  .m-row { display: flex; align-items: center; gap: 12px; padding: 13px 2px; }
  .m-row + .m-row { border-top: 1px dashed rgba(58, 29, 15, 0.25); }
  .m-row .ico { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: #fff; }
  .m-row.r1 .ico { background: var(--royal); } .m-row.r2 .ico { background: var(--wa); }
  .m-row span { flex: 1; display: grid; }
  .m-row b { font-family: var(--disp); font-weight: 700; font-size: 16px; color: var(--royal); }
  .m-row small { font-size: 13px; color: var(--sub); }
  .m-row i { font-style: normal; font-size: 18px; color: var(--royal); }

  /* ——— 3 · দুভাগ / Split: phone + chat icon; the seal splits into a phone half and a WhatsApp half ——— */
  .v3 { --seal-ic: #fff; }
  .sp { position: absolute; z-index: 3; bottom: 82px; width: calc(50% - 4px); height: 70px; display: flex; align-items: center; gap: 10px; color: #fff;
    box-shadow: 0 16px 30px -14px rgba(58, 29, 15, 0.6); opacity: 0; pointer-events: none; transform: translateY(10px);
    transition: clip-path 200ms var(--out), transform 200ms var(--out), opacity 120ms ease 80ms; }
  .sp.call { right: calc(50% + 4px); padding: 0 10px 0 12px; border-radius: 35px 12px 12px 35px; background: var(--royal);
    clip-path: inset(0 0 0 100% round 35px 12px 12px 35px); }
  .sp.wa { left: calc(50% + 4px); flex-direction: row-reverse; text-align: right; padding: 0 12px 0 10px; border-radius: 12px 35px 35px 12px; background: #1fae55;
    clip-path: inset(0 100% 0 0 round 12px 35px 35px 12px); }
  .sp .ico { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 255, 255, 0.16); }
  .sp span { display: grid; line-height: 1.25; } .sp b { font-family: var(--disp); font-weight: 700; font-size: 15.5px; } .sp small { font-size: 12px; opacity: 0.85; }
  .sp > * { transition: transform 200ms var(--out); }
  .sp.call > * { transform: translateX(16px); } .sp.wa > * { transform: translateX(-16px); }
  .phone.open .sp { opacity: 1; pointer-events: auto; transform: none; transition: clip-path 420ms var(--drawer), transform 420ms var(--drawer), opacity 0s; }
  .phone.open .sp.call { clip-path: inset(0 0 0 0 round 35px 12px 12px 35px); }
  .phone.open .sp.wa { clip-path: inset(0 0 0 0 round 12px 35px 35px 12px); }
  .phone.open .sp > * { transform: none; transition: transform 460ms var(--out) 60ms; }

  /* ——— 4 · ডকেই / In-dock: a hand-drawn sticker; the dock itself turns into the order bar ——— */
  .v4 { --seal-ic: var(--royal); --r0: -8deg; }
  .v4 .pill { display: block; }
  .face { position: absolute; inset: 5px; display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: center; gap: 2px; }
  .face.b { grid-template-columns: 1fr 76px 1fr; gap: 0; }
  .face > * { transition: transform 300ms var(--out), opacity 200ms ease; transition-delay: calc(var(--i, 0) * 30ms); }
  .face.b > * { transform: translateY(80%); opacity: 0; pointer-events: none; }
  .phone.open .face.a > * { transform: translateY(-80%); opacity: 0; pointer-events: none; }
  .phone.open .face.b > * { transform: none; opacity: 1; pointer-events: auto; }
  .face.b a { display: flex; align-items: center; justify-content: center; gap: 7px; height: 48px; border-radius: 999px; font-family: var(--disp); font-weight: 700; font-size: 14.5px; color: #fff; white-space: nowrap; }
  .face.b .call { background: var(--royal); } .face.b .wa { background: #1fae55; }
  .face.b .wa-ic { width: 18px; height: 18px; }
  .phone.open .v4 .seal { transform: translateY(8px) scale(0.84); }

  @media (prefers-reduced-motion: reduce) {
    .phone *, .phone *::before, .phone *::after { transition-duration: 0.01ms !important; transition-delay: 0s !important; animation: none !important; }
  }

  /* Picker (verbatim spec) */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">পাখা</button>
  <button class="proto-picker-item">কার্ড</button>
  <button class="proto-picker-item">দুভাগ</button>
  <button class="proto-picker-item">ডকেই</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const TEL = "tel:+8801310980289";
const WA = "https://wa.me/8801303103540?text=" + encodeURIComponent("Hello, I'd like to order: আমসত্ত্ব আচার | Mango Leather Pickle (২৫০ গ্রাম)");
const WA_IMG = (s = 20) => `<img class="wa-ic" style="width:${s}px;height:${s}px" src="https://cdn.reicon.dev/logos/whatsapp/original.svg" alt="">`;
const PHOTO = "https://xnuiaxygeoydtopvcmli.supabase.co/storage/v1/object/public/product-images/690aa8b3-6657-46c4-8df5-addcc1f96035/38fc78e0-2256-4182-8722-6023db8c8662/0ff7b2d1-e5cf-4298-9c0f-149329d8b237/960.webp";

// A scalloped seal outline: a circle whose radius ripples n times around.
function scallop(cx, cy, R, a, n) {
  let d = "";
  for (let k = 0; k <= 280; k++) {
    const t = (k / 280) * Math.PI * 2, r = R + a * Math.cos(n * t);
    d += (k ? "L" : "M") + (cx + r * Math.cos(t)).toFixed(2) + " " + (cy + r * Math.sin(t)).toFixed(2);
  }
  return d + "Z";
}

}

          <a class="m-row r1 m-in press" href="${TEL}"><span class="ico">${I.phone}</span><span><b>ফোনে অর্ডার</b><small class="num">০১৩১০-৯৮০২৮৯</small></span><i>→</i></a>
          <a class="m-row r2 m-in press" href="${WA}" target="_blank" rel="noopener"><span class="ico">${WA_IMG(20)}</span><span><b>হোয়াটসঅ্যাপে অর্ডার</b><small class="num">০১৩০৩-১০৩৫৪০</small></span><i>→</i></a>
        </div>

const TRAY = Object.keys(ICONS);
function tray(v) {
  const active = iconChoice || v.icon;
  return `<div class="tray"><small>আইকন বদলে দেখুন (icones.js.org থেকে)</small>${TRAY.map((id) =>
    `<button data-icon="${id}" title="${id}" aria-label="${id}" aria-pressed="${id === active}">${ICONS[id]}</button>`).join("")}</div>`;
}

function wireToggle(phone) {
  const btn = phone.querySelector("[data-toggle]");
  const set = (open) => { phone.classList.toggle("open", open); btn.setAttribute("aria-expanded", String(open)); };
  btn.addEventListener("click", () => set(!phone.classList.contains("open")));
  phone.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", () => set(false)));
  const onKey = (e) => { if (e.key === "Escape") set(false); };
  document.addEventListener("keydown", onKey);
  return () => document.removeEventListener("keydown", onKey);
}

// Picker wiring (reference behaviour)
const stage = document.getElementById("stage");
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
const replay = picker.querySelector(".proto-picker-replay");
let current = 0, cleanup = null;

stage.addEventListener("click", (e) => {
  const b = e.target.closest("[data-icon]");
  if (!b) return;
  iconChoice = b.dataset.icon;
  stage.querySelectorAll("[data-icon]").forEach((el) => el.setAttribute("aria-pressed", String(el === b)));
  const ci = stage.querySelector(".ci");
  if (ci) ci.innerHTML = ICONS[iconChoice];
});

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  if (cleanup) { cleanup(); cleanup = null; }
  stage.innerHTML = "";
  requestAnimationFrame(() => {
    const v = variants[i];
    stage.innerHTML = `<div class="cap"><b>${v.cap[0]}</b><span>${v.cap[1]}</span>${tray(v)}</div><div class="phone">${page()}${v.dock(v)}</div>`;
    cleanup = wireToggle(stage.querySelector(".phone"));
  });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  iconChoice = null;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current");
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set("v", i + 1);
  history.replaceState(null, "", url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay?.addEventListener("click", () => mount(current));
window.addEventListener("resize", moveHighlight);
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
