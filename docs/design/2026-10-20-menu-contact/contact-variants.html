<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu Contact Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Noto+Serif+Bengali:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Tokens from client/src/stage.css (.stc). The sheet above the contact block copies the live phone menu. */
  :root { --ink: #4a2212; --soft: #9a6a52; --line: #ecd6c8; --wash: #fdf8f4; --leaf: #f08a1c; --pill: #f5ebe2; --wa: #1f9d55;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --serif: "Noto Serif Bengali", serif; --sans: "Geist", "Noto Serif Bengali", sans-serif; }
  html, body { margin: 0; background: #f3ece6; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .num { font-family: var(--serif); font-variant-numeric: tabular-nums; }
  .display { margin: 0; font-family: var(--serif); font-weight: 300; line-height: 1.1; letter-spacing: -0.01em; }
  .display b { font-weight: 600; }
  .press { transition: transform 160ms var(--ease-out), background-color 200ms ease, border-color 200ms ease; }
  .press:active { transform: scale(0.97); }

  .top { max-width: 1240px; margin: 0 auto; padding: 22px 24px 6px; }
  .top h1 { font-size: 26px; }
  .top p { margin: 6px 0 0; color: var(--soft); font-size: 13.5px; }
  .grid { max-width: 1240px; margin: 0 auto; padding: 18px 24px 60px; display: grid; gap: 28px; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
  .lab { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--soft); margin: 0 0 8px; }
  .lab b { color: var(--ink); letter-spacing: 0.04em; text-transform: none; font-size: 15px; font-weight: 600; margin-right: 6px; }
  .phone { width: 390px; max-width: 100%; border-radius: 40px; overflow: hidden; border: 10px solid #1d130d; background: #b8b0aa; box-shadow: 0 30px 60px -30px rgba(74, 34, 18, 0.45); }
  .sheet { margin-top: 80px; background: #fff; border-radius: 22px 22px 0 0; padding: 8px 20px 24px; }
  .grab { width: 40px; height: 5px; border-radius: 5px; background: rgba(91, 45, 23, 0.25); margin: 0 auto 6px; }
  .note { margin: 10px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--soft); }

  /* Copy of the live menu (stm-*) */
  .stm-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 18px; }
  .stm-head .display { font-size: 32px; }
  .stm-close { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); font-size: 16px; }
  .stm-cats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .stm-cat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 8px; text-align: center; }
  .stm-cat + .stm-cat { border-left: 1px solid var(--line); }
  .stm-cat img { width: 84%; aspect-ratio: 1; object-fit: contain; margin-bottom: 6px; }
  .stm-cat b { font-family: var(--serif); font-weight: 500; font-size: 17px; }
  .stm-cat small { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
  .stm-rows { margin-top: 18px; border-top: 1px solid var(--line); }
  .stm-row { display: grid; grid-template-columns: 32px 1fr auto 20px; align-items: baseline; gap: 6px; padding: 16px 2px; border-bottom: 1px solid var(--line); }
  .stm-row .num { font-size: 12.5px; color: var(--soft); }
  .stm-row b { font-family: var(--serif); font-weight: 500; font-size: 19px; }
  .stm-row em { font-style: normal; font-size: 11.5px; color: var(--leaf); border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; align-self: center; }
  .stm-row i { font-style: normal; text-align: right; }
  .old { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .old a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
  .old span { font-size: 12px; color: var(--soft); } .old b { font-size: 16px; font-weight: 400; }

  .ico { width: 18px; height: 18px; flex: none; }
  .wa-logo { width: 20px; height: 20px; flex: none; }

  /* ক · সারি: the contact lines continue the numbered rows above, with a round icon instead of the number. */
  .va { border-top: 0; margin-top: 0; }
  .va .r { display: grid; grid-template-columns: 40px 1fr 20px; align-items: center; gap: 12px; padding: 14px 2px; border-bottom: 1px solid var(--line); }
  .va .r .c { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; }
  .va .r .c.w { background: #e9f6ee; }
  .va .r small { display: block; font-size: 12px; color: var(--soft); }
  .va .r b { font-family: var(--serif); font-weight: 500; font-size: 18px; }
  .va .r i { font-style: normal; text-align: right; }

  /* খ · প্রশ্ন ও বোতাম: a light-serif question, then two full buttons; the numbers sit small in the buttons. */
  .vb { margin-top: 22px; }
  .vb h3 { font-size: 22px; }
  .vb p { margin: 4px 0 14px; font-size: 13px; color: var(--soft); }
  .vb .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vb .btn { height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 10px; }
  .vb .btn span { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
  .vb .btn b { font-weight: 500; font-size: 14px; }
  .vb .btn small { font-size: 11.5px; opacity: 0.75; }
  .vb .call { background: var(--ink); color: #fff; }
  .vb .wa { border: 1px solid var(--line); background: #fff; }

  /* গ · সিল কার্ড: a warm card fronted by the dock's scalloped phone seal, two pill actions underneath. */
  .vc { position: relative; margin-top: 30px; padding: 30px 16px 16px; border-radius: 18px; background: var(--wash); text-align: center; }
  .vc .seal { position: absolute; left: 50%; top: -24px; translate: -50% 0; width: 50px; height: 50px; color: var(--ink); }
  .vc .seal > svg:first-child { width: 100%; height: 100%; }
  .vc .seal .ico { position: absolute; inset: 0; margin: auto; color: #fff; }
  .vc h3 { font-size: 21px; }
  .vc p { margin: 4px 0 14px; font-size: 13px; color: var(--soft); }
  .vc .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vc .act { height: 46px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff; box-shadow: 0 0 0 1px var(--line); font-size: 14px; font-weight: 500; }
  .vc .act.call { background: var(--ink); color: #fff; box-shadow: none; }
  .vc .nums { display: flex; justify-content: space-between; margin-top: 10px; padding: 0 8px; font-size: 12px; color: var(--soft); }
  @media (hover: hover) and (pointer: fine) { .va .r:hover, .vb .wa:hover { background: var(--wash); } }
</style>
</head>
<body>
  <div class="top">
    <h1 class="display">মেনুর <b>যোগাযোগ</b></h1>
    <p>The call / WhatsApp block at the bottom of the phone menu · current version first, then three redesigns.</p>
  </div>
  <div class="grid" id="grid"></div>

<script>
  const PHONE = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>`;
  const WA = `<img class="wa-logo" src="https://cdn.reicon.dev/logos/whatsapp/original.svg" alt="" />`;
  // The dock seal's scalloped edge (dock-contact.tsx): a circle whose radius ripples 14 times.
  const scallop = (() => { let d = ""; for (let i = 0; i <= 140; i++) { const a = (i / 140) * Math.PI * 2, r = 22 + 2 * Math.cos(a * 14); d += `${i ? "L" : "M"}${(25 + r * Math.cos(a)).toFixed(2)},${(25 + r * Math.sin(a)).toFixed(2)}`; } return d + "Z"; })();
  const menu = `<div class="grab"></div><div class="stm-head"><span class="display">কী <b>খুঁজছেন?</b></span><span class="stm-close">✕</span></div>
    <div class="stm-cats">${[["category-mango","ফ্রেশ আম","Fresh mango"],["category-homemade","হোমমেড","Homemade"],["category-jaggery-date-palm","গুড়","Jaggery"]].map(([img,b,s]) => `<a class="stm-cat"><img src="../../../client/public/home/${img}.webp" alt=""><b>${b}</b><small>${s}</small></a>`).join("")}</div>
    <div class="stm-rows">${[["০১","হোম"],["০২","সব পণ্য"],["০৩","সেরা বিক্রিত পণ্য",1]].map(([n,b,h]) => `<a class="stm-row"><span class="num">${n}</span><b>${b}</b>${h ? "<em>জনপ্রিয়</em>" : "<span></span>"}<i>→</i></a>`).join("")}</div>`;
  const V = [
    ["এখন", "Current", `<div class="old"><a><span>কল করুন</span><b class="num">০১৩১০-৯৮০২৮৯</b></a><a><span>হোয়াটসঅ্যাপ</span><b class="num">০১৩০৩-১০৩৫৪০</b></a></div>`, "Two outlined boxes, label and number only: nothing says they're tappable, and they look unrelated to the rows above."],
    ["ক · সারি", "Rows", `<div class="stm-rows va"><a class="r press" href="tel:+8801310980289"><span class="c">${PHONE}</span><span><small>কল করে অর্ডার</small><b class="num">০১৩১০-৯৮০২৮৯</b></span><i>→</i></a><a class="r press" href="#"><span class="c w">${WA}</span><span><small>হোয়াটসঅ্যাপে মেসেজ</small><b class="num">০১৩০৩-১০৩৫৪০</b></span><i>→</i></a></div>`, "Continues the numbered rows: same hairlines and arrow, with a round icon (ink phone, soft-green WhatsApp) where the number was. Quietest, most consistent."],
    ["খ · প্রশ্ন ও বোতাম", "Question + buttons", `<div class="vb"><h3 class="display">অর্ডারে <b>সাহায্য লাগবে?</b></h3><p>ফোনে বা হোয়াটসঅ্যাপে সরাসরি অর্ডার করুন</p><div class="btns"><a class="btn call press" href="tel:+8801310980289">${PHONE}<span><b>কল করুন</b><small class="num">০১৩১০-৯৮০২৮৯</small></span></a><a class="btn wa press" href="#">${WA}<span><b>হোয়াটসঅ্যাপ</b><small class="num">০১৩০৩-১০৩৫৪০</small></span></a></div></div>`, "A light-serif question like the menu title, then two real buttons — dark Call, outlined WhatsApp with its logo — numbers small inside. Clearest call to action."],
    ["গ · সিল কার্ড", "Seal card", `<div class="vc"><span class="seal"><svg viewBox="0 0 50 50"><path d="${scallop}" fill="currentColor"/></svg>${PHONE}</span><h3 class="display">সরাসরি <b>অর্ডার</b></h3><p>কল বা মেসেজ, যেটা সহজ</p><div class="acts"><a class="act call press" href="tel:+8801310980289">${PHONE}কল করুন</a><a class="act press" href="#">${WA}হোয়াটসঅ্যাপ</a></div><div class="nums"><span class="num">০১৩১০-৯৮০২৮৯</span><span class="num">০১৩০৩-১০৩৫৪০</span></div></div>`, "A warm card fronted by the dock's scalloped phone seal, so the menu and dock read as one system. Two pill actions, numbers beneath. Most branded."],
  ];
  document.getElementById("grid").innerHTML = V.map(([n, en, html, note]) => `<div><p class="lab"><b>${n}</b>${en}</p><div class="phone"><div class="sheet">${menu}${html}</div></div><p class="note">${note}</p></div>`).join("");
</script>
</body>
</html>
