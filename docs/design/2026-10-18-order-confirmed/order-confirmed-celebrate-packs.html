<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Confirmed · Celebrate packs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Galada&family=Geist:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
<link rel="preload" as="video" type="video/webm" href="order-pack-motion/renders/pack-jute.webm" />
<style>
  /* Tokens from client/src/poster.css (.sk / .sko) */
  :root {
    --rice: #faf4ea; --royal: #5b2d17; --sun: #f6b826; --pink: #e2547a; --pink-ink: #c23c62;
    --card: #f1e5d3; --ink: #3a1d0f; --sub: #7a6050; --paper: #fffdf8;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --disp: "Noto Serif Bengali", serif;
    --body: "Geist", "Noto Serif Bengali", serif;
  }
  html, body { margin: 0; background: var(--rice); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  img, video { display: block; max-width: 100%; }
  button { font: inherit; border: 0; background: none; color: inherit; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .num { font-family: "Geist", "Noto Serif Bengali", serif; font-variant-numeric: tabular-nums; }
  .script { font-family: "Galada", cursive; font-weight: 400; }
  .press { transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, color 160ms ease; }
  .press:active { transform: scale(0.97); }

  /* ---------- The storefront behind the checkout panel ---------- */
  .ann { background: var(--sun); text-align: center; padding: 8px 12px; font-size: 13px; font-weight: 600; }
  .ann .script { color: var(--pink-ink); font-size: 17px; margin-right: 6px; }
  .hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; }
  .hd img { height: 40px; width: auto; }
  @media (min-width: 720px) { .hd img { height: 58px; } }
  .hd .bag { width: 40px; height: 40px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; }
  .hd .bag svg { width: 20px; height: 20px; }
  .pg { padding: 18px 18px 120px; max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; align-items: center; }
  @media (min-width: 860px) { .pg { grid-template-columns: 1fr 1.1fr; padding: 30px 48px 120px; } .hd { padding: 12px 48px; } }
  .pg .script { color: var(--pink-ink); font-size: 28px; display: inline-block; transform: rotate(-4deg); }
  .pg h1 { margin: 0; font-family: var(--disp); font-weight: 900; color: var(--royal); font-size: clamp(46px, 9vw, 88px); line-height: 1.05; }
  .pg p { color: var(--sub); line-height: 1.7; max-width: 40ch; }
  .pg img { filter: drop-shadow(0 18px 18px rgba(58, 29, 15, 0.22)); }
  .pg .reopen { margin-top: 8px; height: 46px; padding: 0 22px; border-radius: 999px; background: var(--royal); color: var(--rice); font-weight: 700; font-size: 14px; }

  /* ---------- Checkout panel shell (Vaul: right panel on desktop, bottom sheet on phones) ---------- */
  .ov { position: fixed; inset: 0; z-index: 120; background: rgba(42, 28, 20, 0.38); transition: opacity 400ms var(--drawer); }
  .panel { position: fixed; z-index: 121; display: flex; flex-direction: column; background: #fff; color: var(--ink); outline: none; overflow: hidden;
    left: 0; right: 0; bottom: 0; max-height: 94dvh; border-radius: 24px 24px 0 0; box-shadow: 0 -12px 32px -12px rgba(42, 28, 20, 0.35);
    transition: transform 500ms var(--drawer); }
  .grab { position: absolute; z-index: 3; left: 50%; top: 8px; translate: -50% 0; width: 40px; height: 5px; border-radius: 5px; background: rgba(91, 45, 23, 0.3); }
  @media (min-width: 768px) {
    .panel { left: auto; top: 16px; right: 16px; bottom: 16px; max-height: none; width: min(520px, calc(100vw - 32px)); border-radius: 26px;
      box-shadow: 0 0 0 1px rgba(58, 29, 15, 0.06), 0 24px 48px -16px rgba(42, 28, 20, 0.35); }
    .grab { display: none; }
  }
  .closed .ov { opacity: 0; pointer-events: none; }
  .closed .panel { transform: translateY(100%); }
  @media (min-width: 768px) { .closed .panel { transform: translateX(calc(100% + 24px)); } }
  .scroll { min-height: 0; flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 768px) { .scroll { padding-bottom: 30px; } }
  .x { position: absolute; z-index: 3; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 253, 248, 0.7); color: var(--royal); }
  @media (max-width: 767px) { .x { top: 18px; } }
  .x svg { width: 20px; height: 20px; }

  /* Shared bits */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 15px; width: 100%; }
  .btn-sun { background: var(--sun); color: var(--ink); }
  .btn-line { background: #fff; color: var(--royal); box-shadow: inset 0 0 0 1.5px rgba(91, 45, 23, 0.2); }
  .btn-wa { background: #25d366; color: #fff; }
  .btn svg, .btn img { width: 18px; height: 18px; flex: none; }
  @media (hover: hover) and (pointer: fine) {
    .btn-sun:hover { background: #efad12; }
    .btn-line:hover { box-shadow: inset 0 0 0 1.5px rgba(91, 45, 23, 0.4); }
  }
  .swap { display: inline-grid; }
  .swap > * { grid-area: 1 / 1; transition: opacity 150ms ease-out, filter 150ms ease-out, transform 150ms var(--ease-out); }
  .swap > :last-child { opacity: 0; filter: blur(2px); transform: translateY(4px); }
  [data-copied] .swap > :first-child { opacity: 0; filter: blur(2px); transform: translateY(-4px); }
  [data-copied] .swap > :last-child { opacity: 1; filter: none; transform: none; }

  .rise { animation: rise 280ms var(--ease-out) both; animation-delay: var(--d, 0ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  /* =================== CELEBRATE =================== */
  .v3-sun { position: relative; background: var(--sun); padding: 30px 18px 0; border-radius: 0 0 34px 34px; overflow: hidden; text-align: center; }
  @media (max-width: 767px) { .v3-sun { padding-top: 34px; } }
  .v3-sun::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 120%, rgba(255, 253, 248, 0.55), transparent 60%); }
  .v3-kick { position: relative; font-family: var(--disp); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; color: var(--royal); }
  .v3-big { position: relative; display: block; margin-top: 2px; font-size: 64px; line-height: 1.15; color: var(--pink-ink); transform: rotate(-4deg);
    animation: v3-word 360ms var(--ease-out) 40ms both; }
  @keyframes v3-word { from { opacity: 0; transform: rotate(-4deg) translateY(10px) scale(0.96); filter: blur(4px); } }
  /* The pack: a 600×600 transparent render. Its own entrance is baked into the video, so no CSS motion here. */
  .pack { position: relative; width: 300px; max-width: 100%; aspect-ratio: 1; margin: -70px auto -12px; pointer-events: none; }
  @media (max-width: 767px) { .pack { width: 284px; margin-top: -68px; margin-bottom: -14px; } }
  .pack video, .pack img { width: 100%; height: 100%; object-fit: contain; }
  .pack img { display: none; }
  .pack[data-still] video { display: none; }
  .pack[data-still] img { display: block; animation: rise 360ms var(--ease-out) 120ms both; }

  .v3-body { padding: 0 18px; }
  @media (min-width: 768px) { .v3-body { padding: 0 28px; } }
  .v3-body h2 { margin: 22px 0 0; text-align: center; font-family: var(--disp); font-weight: 900; font-size: 23px; line-height: 1.35; color: var(--royal); text-wrap: balance; }
  .v3-body > p { margin: 6px auto 0; max-width: 34ch; text-align: center; font-size: 13.5px; line-height: 1.65; color: var(--sub); }
  .ticket { position: relative; display: flex; align-items: center; width: 100%; margin-top: 18px; border-radius: 18px; background: var(--paper); box-shadow: inset 0 0 0 1.5px rgba(91, 45, 23, 0.14); text-align: left; overflow: hidden; }
  .ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 1.5px rgba(91, 45, 23, 0.14); transform: translateY(-50%); }
  .ticket::before { left: -9px; } .ticket::after { right: -9px; }
  .ticket-l { flex: 1; padding: 14px 22px; }
  .ticket-l small { display: block; font-size: 11.5px; color: var(--sub); }
  .ticket-l .num { font-size: 28px; font-weight: 700; letter-spacing: 0.02em; color: var(--royal); line-height: 1.2; }
  .ticket-r { align-self: stretch; display: grid; place-items: center; padding: 0 22px; border-left: 2px dashed rgba(91, 45, 23, 0.18); font-size: 13px; font-weight: 700; color: var(--pink-ink); }
  .ticket-r svg { width: 15px; height: 15px; display: inline; vertical-align: -2px; margin-right: 4px; }
  @media (hover: hover) and (pointer: fine) { .ticket:hover { box-shadow: inset 0 0 0 1.5px rgba(91, 45, 23, 0.3); } }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .fact { padding: 12px 8px; border-radius: 16px; background: #f6f6f4; text-align: center; }
  .fact svg { width: 20px; height: 20px; color: var(--royal); margin: 0 auto 6px; }
  .fact b { display: block; font-family: var(--disp); font-size: 13.5px; color: var(--royal); line-height: 1.3; }
  .fact small { display: block; margin-top: 2px; font-size: 11px; color: var(--sub); line-height: 1.35; }
  .v3-acts { display: grid; gap: 10px; margin-top: 18px; }
  .v3-acts .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .v3-acts .row .btn { height: 46px; font-size: 13.5px; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .rise, .v3-big, .pack[data-still] img { animation: none !important; }
    .ov, .panel { transition: none; }
    .press:active { transform: none; }
  }

  /* ---------- Picker (verbatim from PICKER.md) ---------- */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; white-space: nowrap; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
  <div class="ann"><span class="script">শীতের সেরা</span>খেজুরের পাটালী এসে গেছে · ৳২৬০০+ অর্ডারে ফ্রি ডেলিভারি</div>
  <header class="hd">
    <img src="../../../attached_assets/sera-khabar-leaf-logo.webp" alt="সেরা খাবার" />
    <span class="bag" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></span>
  </header>
  <main class="pg">
    <div>
      <span class="script">এই শীতে</span>
      <h1>খেজুরের পাটালী</h1>
      <p>যশোরের গাছির হাতে জ্বাল দেওয়া খাঁটি খেজুরের রস থেকে তৈরি। ক্যাশ অন ডেলিভারি, সারা দেশে।</p>
      <button type="button" class="reopen press" id="reopen">কনফার্মেশন আবার দেখুন</button>
    </div>
    <img src="/home/hero-jaggery-still-life.webp" alt="" width="960" height="640" />
  </main>

  <div id="stage"></div>

  <nav class="proto-picker" aria-label="Prototype variants" data-position="top">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Jute sack</button>
    <button class="proto-picker-item">Mishti box</button>
    <button class="proto-picker-item">Kraft bag</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

<script>
  const order = {
    ref: "1048",
    first: "রাকিব",
    delivery: 100,
    items: [{ unit: 671, qty: 1 }, { unit: 300, qty: 2 }],
  };
  const total = order.items.reduce((s, i) => s + i.unit * i.qty, 0) + order.delivery;
  const bn = (v) => String(v).replace(/\d/g, (d) => "০১২৩৪৫৬৭৮৯"[d]);
  const tk = (v) => "৳" + bn(v.toLocaleString("en-IN"));
  const MONTHS = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
  const eta = (() => { const a = addDays(1), b = addDays(2); return a.getMonth() === b.getMonth() ? `${bn(a.getDate())}–${bn(b.getDate())} ${MONTHS[b.getMonth()]}` : `${bn(a.getDate())} ${MONTHS[a.getMonth()]} – ${bn(b.getDate())} ${MONTHS[b.getMonth()]}`; })();
  const wa = `https://wa.me/8801303103540?text=${encodeURIComponent(`Hello, my order number is ${order.ref}`)}`;

  const I = {
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
    truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
    cash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5v.01M17.5 14.5v.01"/></svg>',
    wa: '<img src="https://cdn.reicon.dev/logos/whatsapp/original.svg" alt="" style="filter:brightness(0) invert(1)" />',
  };

  const PACKS = ["jute", "mishti", "kraft"];
  const ART = "order-pack-motion/renders/";
  // Safari decodes VP9 WebM but drops the alpha channel, and reduced-motion users get the final frame.
  const isSafari = /^((?!chrome|chromium|crios|android|edg).)*safari/i.test(navigator.userAgent);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  const still = () => isSafari || reduced.matches;

  const celebrate = (p) => `
    <div class="ov" data-close></div>
    <div class="panel" role="dialog" aria-modal="true" aria-label="অর্ডার কনফার্ম">
      <div class="grab" aria-hidden="true"></div>
      <button type="button" class="x press" data-close aria-label="বন্ধ করুন">${I.x}</button>
      <div class="scroll">
        <div class="v3-sun">
          <div class="v3-kick">অর্ডার কনফার্ম</div>
          <span class="v3-big script">ধন্যবাদ!</span>
          <div class="pack" aria-hidden="true" ${still() ? "data-still" : ""}>
            ${still() ? "" : `<video src="${ART}pack-${p}.webm" autoplay muted playsinline preload="auto" disablepictureinpicture></video>`}
            <img src="${ART}pack-${p}-poster.webp" alt="" width="600" height="600" />
          </div>
        </div>
        <div class="v3-body">
          <h2 class="rise" style="--d:260ms">${order.first}, আপনার গুড় তৈরি হচ্ছে পাঠানোর জন্য</h2>
          <p class="rise" style="--d:300ms">আমাদের টিম শীঘ্রই ফোন করে অর্ডারটি কনফার্ম করবে।</p>
          <button type="button" class="ticket press rise" style="--d:340ms" data-copy aria-label="অর্ডার নম্বর কপি করুন">
            <span class="ticket-l"><small>অর্ডার নম্বর</small><span class="num">#${order.ref}</span></span>
            <span class="ticket-r"><span class="swap"><span>${I.copy}কপি</span><span>কপি হয়েছে ✓</span></span></span>
          </button>
          <div class="facts rise" style="--d:380ms">
            <div class="fact">${I.phone}<b>ফোন পাবেন</b><small>কয়েক ঘণ্টার মধ্যে</small></div>
            <div class="fact">${I.truck}<b>${eta}</b><small>ডেলিভারি</small></div>
            <div class="fact">${I.cash}<b>${tk(total)}</b><small>হাতে পেয়ে ক্যাশে</small></div>
          </div>
          <div class="v3-acts rise" style="--d:420ms">
            <button type="button" class="btn btn-sun press" data-close>আরও কিছু দেখুন</button>
            <div class="row">
              <a class="btn btn-line press" href="tel:+8801310980289">${I.phone}ফোন করুন</a>
              <a class="btn btn-wa press" href="${wa}" target="_blank" rel="noopener noreferrer">${I.wa}হোয়াটসঅ্যাপ</a>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  const variants = PACKS.map((p) => () => celebrate(p));

  const stage = document.getElementById("stage");
  stage.addEventListener("click", async (e) => {
    if (e.target.closest("[data-close]")) { stage.classList.add("closed"); return; }
    const copy = e.target.closest("[data-copy]");
    if (copy) {
      try { await navigator.clipboard.writeText(order.ref); } catch {}
      copy.setAttribute("data-copied", "");
      clearTimeout(copy._t);
      copy._t = setTimeout(() => copy.removeAttribute("data-copied"), 1600);
    }
  });
  // If the video can't decode, fall back to the poster rather than an empty sun block.
  stage.addEventListener("error", (e) => { if (e.target.tagName === "VIDEO") e.target.closest(".pack").setAttribute("data-still", ""); }, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") stage.classList.add("closed"); });
  document.getElementById("reopen").addEventListener("click", () => mount(current));

  // ---------- Picker wiring (PICKER.md reference) ----------
  const picker = document.querySelector(".proto-picker");
  const highlight = picker.querySelector(".proto-picker-highlight");
  const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
  const replay = picker.querySelector(".proto-picker-replay");
  let current = 0;

  function moveHighlight() {
    const el = items[current];
    highlight.style.width = el.offsetWidth + "px";
    highlight.style.transform = `translateX(${el.offsetLeft}px)`;
  }
  function mount(i) {
    stage.innerHTML = "";
    stage.classList.remove("closed");
    requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
  }
  function setActive(i) {
    if (i < 0 || i >= variants.length) return;
    current = i;
    items.forEach((el, j) => {
      el.toggleAttribute("data-active", j === i);
      if (j === i) el.setAttribute("aria-current", "true");
      else el.removeAttribute("aria-current");
    });
    moveHighlight();
    const url = new URL(location);
    url.searchParams.set("v", i + 1);
    history.replaceState(null, "", url);
    mount(i);
  }
  items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
  replay?.addEventListener("click", () => mount(current));
  window.addEventListener("resize", moveHighlight);
  document.addEventListener("keydown", (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const num = parseInt(e.key, 10);
    if (num >= 1 && num <= variants.length) setActive(num - 1);
    else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
    else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
    else if (e.key === "r" || e.key === "R") mount(current);
  });
  // Warm the other two renders so switching packs doesn't flash an empty block.
  if (!still()) PACKS.forEach((p) => { const l = document.createElement("link"); l.rel = "prefetch"; l.href = `${ART}pack-${p}.webm`; document.head.append(l); });
  setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
</body>
</html>
