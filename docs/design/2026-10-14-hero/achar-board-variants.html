<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>আচার Signboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Galada&family=Geist:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
<style>
  /* Tokens from client/src/poster.css (.sk) */
  :root {
    --rice: #faf4ea; --royal: #5b2d17; --sun: #f6b826; --pink: #e2547a;
    --card: #f1e5d3; --ink: #3a1d0f; --sub: #7a6050; --paper: #fffdf8;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --disp: "Noto Serif Bengali", serif;
  }
  html, body { margin: 0; background: var(--rice); color: var(--ink); font-family: "Geist", "Noto Serif Bengali", serif; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  button { font: inherit; border: 0; background: none; color: inherit; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  .script { font-family: "Galada", cursive; font-weight: 400; }
  .wrap { padding: 0 18px; max-width: 1240px; margin: 0 auto; }
  @media (min-width: 760px) { .wrap { padding: 0 40px; } }
  .press { transition: transform 160ms var(--ease-out), background-color 160ms ease; }
  .press:active { transform: scale(0.97); }
  .num { font-family: "Geist", "Noto Serif Bengali", serif; font-variant-numeric: tabular-nums; font-weight: 700; }

  /* Context: the end of the গুড় shelf above, the হোমমেড shelf heading below, and the phone dock */
  .ctx-shelf { padding: 30px 0 0; }
  .ctx-shelf h2, .ctx-next h2 { margin: 0 0 16px; font-family: var(--disp); font-weight: 700; font-size: clamp(26px, 4.6vw, 40px); color: var(--royal); }
  .ctx-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ctx-cards span { height: 120px; border-radius: 22px; background: var(--card); }
  .ctx-rule { height: 1px; background: rgba(91, 45, 23, 0.14); margin-top: 22px; }
  .ctx-next { padding: 30px 0 200px; }
  .dock { position: fixed; z-index: 50; left: 12px; right: 12px; bottom: 12px; display: flex; justify-content: center; }
  .dock-pill { width: 100%; max-width: 440px; height: 60px; border-radius: 999px; background: var(--paper); box-shadow: 0 10px 30px -10px rgba(42, 28, 20, 0.35), 0 0 0 1px rgba(91, 45, 23, 0.06); }
  @media (min-width: 760px) { .dock { display: none; } }

  .btn-sun { height: 50px; padding: 0 24px; border-radius: 999px; background: var(--sun); color: var(--ink); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 10px; width: max-content; }
  .btn-sun i { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); }
  .btn-royal { height: 50px; padding: 0 24px; border-radius: 999px; background: var(--royal); color: var(--rice); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 10px; width: max-content; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips span { height: 32px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; font-family: var(--disp); font-weight: 700; font-size: 14px; }
  .chips i { width: 8px; height: 8px; border-radius: 50%; }

  /* Entrance (re-runs on switch / ↻): text fades up in order, the photo settles. Individual
     translate/scale compose with an element's own rotate. */
  [data-in] { animation: rise 520ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 70ms + 60ms); }
  [data-settle] { animation: settle 900ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 70ms); }
  @keyframes rise { from { opacity: 0; translate: 0 10px; } }
  @keyframes settle { from { opacity: 0; scale: 1.06; } }

  .stamp { position: absolute; z-index: 3; width: 104px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; text-align: center; rotate: -12deg; }
  .stamp b { display: block; font-size: 28px; line-height: 1; }
  .stamp small { font-family: var(--disp); font-size: 12px; font-weight: 600; }

  /* ───────── 1 · Current (as live) ───────── */
  .cur { background: var(--royal); color: var(--rice); margin-block: 70px 30px; padding-block: 0 34px; }
  .cur .in { display: grid; gap: 10px; align-items: end; }
  @media (min-width: 760px) { .cur .in { grid-template-columns: 1fr 1fr; gap: 30px; } }
  .cur img { width: 100%; max-width: 440px; margin: -60px auto 0; rotate: -4deg; }
  .cur .tag { color: var(--sun); font-size: clamp(20px, 3.2vw, 30px); rotate: -3deg; display: inline-block; }
  .cur h2 { margin: 0; font-family: var(--disp); font-weight: 900; font-size: clamp(30px, 5.4vw, 54px); line-height: 1.15; }
  .cur p { margin: 0; font-size: 14.5px; line-height: 1.7; opacity: 0.85; max-width: 42ch; }
  .cur .buy { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 6px; }
  .cur .price { font-size: clamp(40px, 7vw, 64px); line-height: 1; color: var(--sun); display: flex; align-items: baseline; gap: 6px; }
  .cur .price small { font-family: var(--disp); font-size: 13px; font-weight: 600; color: var(--rice); opacity: 0.7; }
  .cur .txt { display: flex; flex-direction: column; gap: 10px; }

  /* ───────── 2 · Glow: a warm spotlight lifts the red আচার off the brown ───────── */
  .glow { position: relative; background: var(--royal); color: var(--rice); margin-block: 40px 30px; padding: 30px 0 38px; overflow: hidden; text-align: center; }
  .glow::before { content: ""; position: absolute; left: 50%; top: 210px; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(246, 184, 38, 0.09) 0deg 6deg, transparent 6deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, transparent 62%); mask-image: radial-gradient(circle, #000 0, transparent 62%); }
  .glow::after { content: ""; position: absolute; left: 50%; top: 210px; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 214, 120, 0.75), rgba(246, 184, 38, 0.3) 50%, transparent); }
  .glow .in { position: relative; z-index: 1; display: grid; justify-items: center; gap: 10px; }
  .glow .art { position: relative; width: min(100%, 460px); }
  .glow .art img { width: 100%; filter: drop-shadow(0 22px 22px rgba(0, 0, 0, 0.45)); }
  .glow .stamp { right: -2%; top: 4%; background: var(--pink); color: #fff; box-shadow: 0 0 0 5px var(--royal), 0 0 0 6.5px var(--pink); }
  .glow .tag { color: var(--sun); font-size: clamp(22px, 4vw, 32px); rotate: -3deg; display: inline-block; margin-top: 6px; }
  .glow h2 { margin: 0; font-family: var(--disp); font-weight: 900; font-size: clamp(38px, 9vw, 64px); line-height: 1.1; }
  .glow p { margin: 0; max-width: 36ch; font-size: 14.5px; line-height: 1.7; opacity: 0.85; }
  .glow .btn-sun { margin-top: 8px; }

  /* ───────── 3 · Turmeric: the board turns yellow; red on yellow is the strongest warm contrast ───────── */
  .turm { background: var(--sun); color: var(--royal); margin-block: 70px 30px; padding: 0 0 36px; }
  .turm .in { display: grid; gap: 8px; }
  @media (min-width: 760px) { .turm .in { grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; } }
  .turm .art { position: relative; margin-top: -64px; }
  .turm .art img { width: 100%; max-width: 480px; margin: 0 auto; filter: drop-shadow(0 22px 20px rgba(91, 45, 23, 0.35)); }
  .turm .stamp { left: 0; top: 18%; background: var(--royal); color: var(--sun); box-shadow: 0 0 0 5px var(--sun), 0 0 0 6.5px var(--royal); }
  .turm .tag { color: var(--pink); font-size: clamp(24px, 4.4vw, 34px); rotate: -4deg; display: inline-block; }
  .turm h2 { margin: 0; font-family: var(--disp); font-weight: 900; font-size: clamp(44px, 11vw, 80px); line-height: 1.05; letter-spacing: -0.01em; }
  .turm p { margin: 10px 0 14px; max-width: 38ch; font-size: 15px; line-height: 1.7; color: var(--ink); font-weight: 500; }
  .turm .chips span { background: rgba(91, 45, 23, 0.1); color: var(--royal); }
  .turm .btn-royal { margin-top: 18px; }

  /* ───────── 4 · Big word: a giant yellow "আচার" behind the bowl ───────── */
  .word { position: relative; background: var(--royal); color: var(--rice); margin-block: 40px 30px; padding: 30px 0 38px; overflow: hidden; text-align: center; }
  .word .pre { display: block; font-family: var(--disp); font-weight: 700; font-size: clamp(22px, 5vw, 40px); color: var(--rice); }
  .word .giant { margin: 0; font-family: var(--disp); font-weight: 900; font-size: clamp(110px, 29vw, 330px); line-height: 1; letter-spacing: -0.03em; color: var(--sun); white-space: nowrap; }
  .word .art { position: relative; z-index: 2; width: min(92%, 520px); margin: clamp(-150px, -18vw, -56px) auto 0; }
  .word .art img { width: 100%; filter: drop-shadow(0 24px 24px rgba(0, 0, 0, 0.5)); }
  .word .stamp { right: 0; top: 0; background: var(--pink); color: #fff; box-shadow: 0 0 0 5px var(--royal), 0 0 0 6.5px var(--pink); }
  .word .foot { position: relative; z-index: 3; display: grid; justify-items: center; gap: 12px; padding: 0 18px; margin-top: 6px; }
  .word .tag { color: var(--sun); font-size: clamp(22px, 4vw, 30px); rotate: -3deg; display: inline-block; }
  .word p { margin: 0; max-width: 36ch; font-size: 14.5px; line-height: 1.7; opacity: 0.85; }

  /* ───────── 5 · Label: a scalloped pickle-jar label, the way আচার is sold ───────── */
  .label-sec { padding: 40px 0 20px; }
  /* Scalloped edge: a row of pink dots peeks out around the paper card laid on top. */
  .label { position: relative; max-width: 560px; margin: 0 auto; padding: 9px; rotate: 1deg;
    background: radial-gradient(circle, var(--pink) 7px, transparent 7.5px) 0 0 / 18px 18px; filter: drop-shadow(0 12px 18px rgba(58, 29, 15, 0.16)); }
  .label-in { position: relative; background: var(--paper); padding: 22px 20px 26px; text-align: center; box-shadow: 0 0 0 5px var(--pink); outline: 1.5px solid var(--royal); outline-offset: -8px; }
  .label-top { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: var(--sub); text-transform: uppercase; }
  .label-top b { color: var(--pink); }
  .label .art { position: relative; width: min(100%, 400px); margin: 6px auto 0; }
  .label .art img { width: 100%; filter: drop-shadow(0 16px 16px rgba(58, 29, 15, 0.25)); }
  .label .stamp { right: -4%; top: 2%; background: var(--sun); color: var(--royal); box-shadow: 0 0 0 5px var(--paper), 0 0 0 6.5px var(--sun); }
  .label .tag { color: var(--pink); font-size: 24px; rotate: -3deg; display: inline-block; }
  .label h2 { margin: 0; font-family: var(--disp); font-weight: 900; font-size: clamp(40px, 10vw, 60px); line-height: 1.1; color: var(--royal); }
  .label p { margin: 8px auto 14px; max-width: 34ch; font-size: 14px; line-height: 1.7; color: var(--ink); }
  .label .chips { justify-content: center; }
  .label .chips span { background: var(--card); color: var(--royal); }
  .label .btn-royal { margin-top: 18px; }

  @media (prefers-reduced-motion: reduce) {
    [data-in], [data-settle] { animation-name: fade !important; animation-duration: 160ms !important; animation-delay: 0ms !important; }
    @keyframes fade { from { opacity: 0; } }
  }

  /* ── Picker: verbatim from emilkowalski/skills prototype/PICKER.md. Top, because the phone dock owns bottom-center. ── */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Current</button>
  <button class="proto-picker-item">Glow</button>
  <button class="proto-picker-item">Turmeric</button>
  <button class="proto-picker-item">Big word</button>
  <button class="proto-picker-item">Label</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const IMG = "../../../client/public/home/achar-ad.webp";
const TITLE = "আমসত্ত্ব আচার";
const COPY = "খাঁটি আমসত্ত্বে তৈরি, মিষ্টি-টক-ঝালের দারুণ সমন্বয়। বাছাই করা মসলা আর ঐতিহ্যবাহী স্বাদে বানানো।";
const PRICE = "৩৫০";
// The three tastes the product description names; colours only, no invented strengths.
const TASTES = `<div class="chips"><span><i style="background:#f6b826"></i>মিষ্টি</span><span><i style="background:#8ab840"></i>টক</span><span><i style="background:#d2342a"></i>ঝাল</span></div>`;
const stamp = `<div class="stamp" data-in style="--d:5"><span><b class="num">৳${PRICE}</b><small>থেকে শুরু</small></span></div>`;

const context = (board) => `
  <section class="ctx-shelf"><div class="wrap"><h2>আমাদের গুড়</h2><div class="ctx-cards"><span></span><span></span></div><div class="ctx-rule"></div></div></section>
  ${board}
  <section class="ctx-next"><div class="wrap"><h2>আমাদের হোমমেড</h2><div class="ctx-cards"><span></span><span></span></div></div></section>
  <nav class="dock"><div class="dock-pill"></div></nav>`;

const VARIANTS = [
  // 1 · Current, as live
  () => `<section class="cur"><div class="wrap in">
    <img data-settle src="${IMG}" alt="${TITLE}">
    <div class="txt">
      <span class="script tag" data-in style="--d:1">টক-ঝাল-মিষ্টি</span>
      <h2 data-in style="--d:2">${TITLE}</h2>
      <p data-in style="--d:3">${COPY}</p>
      <div class="buy" data-in style="--d:4"><span class="price num"><small>শুরু</small>৳${PRICE}</span><a class="btn-sun press" href="#">এখনই অর্ডার করুন <i></i></a></div>
    </div>
  </div></section>`,

  // 2 · Glow
  () => `<section class="glow"><div class="wrap in">
    <div class="art">${stamp}<img data-settle src="${IMG}" alt="${TITLE}"></div>
    <span class="script tag" data-in style="--d:2">টক-ঝাল-মিষ্টি</span>
    <h2 data-in style="--d:3">${TITLE}</h2>
    <p data-in style="--d:4">${COPY}</p>
    <a class="btn-sun press" href="#" data-in style="--d:5">এখনই অর্ডার করুন <i></i></a>
  </div></section>`,

  // 3 · Turmeric
  () => `<section class="turm"><div class="wrap in">
    <div class="art">${stamp}<img data-settle src="${IMG}" alt="${TITLE}"></div>
    <div>
      <span class="script tag" data-in style="--d:1">টক-ঝাল-মিষ্টি</span>
      <h2 data-in style="--d:2">${TITLE}</h2>
      <p data-in style="--d:3">${COPY}</p>
      <div data-in style="--d:4">${TASTES}</div>
      <div data-in style="--d:5"><a class="btn-royal press" href="#">এখনই অর্ডার করুন →</a></div>
    </div>
  </div></section>`,

  // 4 · Big word
  () => `<section class="word">
    <span class="pre" data-in style="--d:1">আমসত্ত্ব</span>
    <h2 class="giant" data-in style="--d:2">আচার</h2>
    <div class="art">${stamp}<img data-settle style="--d:2" src="${IMG}" alt="${TITLE}"></div>
    <div class="foot">
      <span class="script tag" data-in style="--d:3">টক-ঝাল-মিষ্টি</span>
      <p data-in style="--d:4">${COPY}</p>
      <a class="btn-sun press" href="#" data-in style="--d:5">এখনই অর্ডার করুন <i></i></a>
    </div>
  </section>`,

  // 5 · Label
  () => `<section class="label-sec"><div class="wrap">
    <div class="label" data-in style="--d:0"><div class="label-in">
      <div class="label-top">সেরা খাবার · <b>ঘরে বানানো</b> · রাজশাহী</div>
      <div class="art">${stamp}<img data-settle style="--d:1" src="${IMG}" alt="${TITLE}"></div>
      <span class="script tag" data-in style="--d:2">টক-ঝাল-মিষ্টি</span>
      <h2 data-in style="--d:3">${TITLE}</h2>
      <p data-in style="--d:4">${COPY}</p>
      <div data-in style="--d:4">${TASTES}</div>
      <a class="btn-royal press" href="#" data-in style="--d:5">এখনই অর্ডার করুন →</a>
    </div></div>
  </div></section>`,
];

/* ── Mount: scrolls the board into view, since it sits mid-page on the real homepage ── */
const stage = document.getElementById("stage");
function mount(i) {
  stage.innerHTML = "";
  requestAnimationFrame(() => {
    stage.innerHTML = context(VARIANTS[i]());
    const board = stage.querySelector("section:nth-of-type(2)");
    window.scrollTo(0, Math.max(0, board.offsetTop - 70));
  });
}
stage.addEventListener("click", (e) => { if (e.target.closest('a[href="#"]')) e.preventDefault(); });

/* ── Picker wiring: verbatim behavior contract from PICKER.md ── */
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
const replay = picker.querySelector(".proto-picker-replay");
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function setActive(i) {
  if (i < 0 || i >= VARIANTS.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set("v", i + 1);
  history.replaceState(null, "", url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay?.addEventListener("click", () => mount(current));
window.addEventListener("resize", moveHighlight);

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= VARIANTS.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % VARIANTS.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + VARIANTS.length) % VARIANTS.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
</body>
</html>
