<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Poster Hero Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Galada&family=Geist:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
<style>
  /* Tokens from client/src/poster.css (.sk) */
  :root {
    --rice: #faf4ea; --royal: #5b2d17; --sun: #f6b826; --pink: #e2547a;
    --card: #f1e5d3; --ink: #3a1d0f; --sub: #7a6050; --paper: #fffdf8;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --disp: "Noto Serif Bengali", serif;
  }
  html, body { margin: 0; background: var(--rice); color: var(--ink); font-family: "Geist", "Noto Serif Bengali", serif; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  button { font: inherit; border: 0; background: none; color: inherit; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  .script { font-family: "Galada", cursive; font-weight: 400; }
  .wrap { padding: 0 18px; max-width: 1240px; margin: 0 auto; }
  @media (min-width: 760px) { .wrap { padding: 0 40px; } }
  .press { transition: transform 160ms var(--ease-out), background-color 160ms ease; }
  .press:active { transform: scale(0.97); }

  /* Shared chrome copied from the live site */
  .ann { background: var(--sun); display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .ann .script { color: var(--pink); font-size: 17px; }
  .ann .ann-stamp { border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 11px; transform: rotate(-2deg); }
  .ann .go { background: var(--royal); color: var(--rice); border-radius: 999px; padding: 5px 12px; font-size: 12px; }
  @media (max-width: 600px) { .ann .ann-stamp { display: none; } }
  .hd { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 18px; background: var(--rice); }
  @media (min-width: 760px) { .hd { padding: 12px 40px; } }
  .hd .menu { display: flex; gap: 16px; font-size: 13px; font-weight: 600; color: var(--royal); align-items: center; }
  .hd .menu a.txt { display: none; }
  @media (min-width: 760px) { .hd .menu a.txt { display: inline; } .hd .menu .ic-menu { display: none; } }
  .ic-round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: var(--ink); position: relative; }
  .ic-round svg, .ic-plain svg { width: 20px; height: 20px; }
  .ic-plain { width: 40px; height: 40px; display: grid; place-items: center; color: var(--royal); }
  .logo { height: 46px; width: auto; }
  .hd .right { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .next { padding: 60px 0 160px; text-align: center; }
  .next h2 { margin: 0; font-family: var(--disp); font-weight: 900; color: var(--royal); font-size: clamp(26px, 4.6vw, 42px); }
  .next .script { display: block; color: var(--pink); font-size: 22px; transform: rotate(-4deg); }
  .next .row { display: flex; justify-content: center; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
  .next .row span { width: 150px; height: 110px; border-radius: 22px; background: var(--card); }
  .dock { position: fixed; z-index: 50; left: 12px; right: 12px; bottom: 12px; display: flex; justify-content: center; }
  .dock-pill { width: 100%; max-width: 440px; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: var(--paper); box-shadow: 0 10px 30px -10px rgba(42, 28, 20, 0.35), 0 0 0 1px rgba(91, 45, 23, 0.06); }
  .dock-pill > * { height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--sub); flex: 1; }
  .dock-pill .on { flex: 1.9; background: var(--card); color: var(--royal); gap: 7px; font-family: var(--disp); font-weight: 700; font-size: 15px; }
  .dock-pill .cart { flex: none; width: 50px; background: var(--sun); color: var(--ink); }
  .dock-pill svg { width: 22px; height: 22px; }
  @media (min-width: 760px) { .dock { display: none; } }

  .btn-royal { height: 50px; padding: 0 24px; border-radius: 999px; background: var(--royal); color: var(--rice); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 10px; }
  .btn-sun { height: 50px; padding: 0 24px; border-radius: 999px; background: var(--sun); color: var(--ink); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 10px; }

  /* Entrance shared by every variant: text fades up in order, photos settle. Runs on each switch / ↻.
     Individual translate/scale compose with an element's own transform (tilted script, stamps). */
  [data-in] { animation: rise 520ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 70ms + 60ms); }
  [data-settle] { animation: settle 900ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 70ms); }
  @keyframes rise { from { opacity: 0; translate: 0 10px; } }
  @keyframes settle { from { opacity: 0; scale: 1.06; } }

  /* The poster structure every variant starts from */
  .pst { position: relative; overflow: hidden; }
  .pst .wrap { position: relative; display: grid; padding-top: 26px; }
  @media (min-width: 860px) { .pst .wrap { grid-template-columns: 1.05fr 1fr; align-items: center; padding-top: 40px; } }
  .pst .kick { font-size: clamp(24px, 5vw, 36px); transform: rotate(-5deg); display: inline-block; }
  .pst h1 { margin: 0; font-family: var(--disp); font-weight: 900; font-size: clamp(64px, 17vw, 150px); line-height: 0.95; letter-spacing: -0.02em; }
  .pst .lede { margin: 16px 0 20px; max-width: 32ch; font-size: 15.5px; line-height: 1.7; font-weight: 500; }
  .pst .trust { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; padding-bottom: 8px; font-size: 13px; font-weight: 600; }
  .pst .trust span::before { content: "✓ "; }
  .pst .art { position: relative; margin: 8px -8% -12% 0; }
  @media (min-width: 860px) { .pst .art { margin: 0 -6% -10% 0; } }
  .pst .art img { width: 100%; filter: drop-shadow(0 24px 22px rgba(58, 29, 15, 0.28)); }
  .price-stamp { position: absolute; z-index: 2; left: 2%; top: 6%; width: 112px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; text-align: center; transform: rotate(-12deg); }
  .price-stamp b { display: block; font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .price-stamp small { font-family: var(--disp); font-size: 12px; }

  /* ───────── 1 · Classic (the approved Poster) ───────── */
  .classic { background: var(--sun); color: var(--royal); }
  .classic .kick { color: var(--pink); }
  .classic .lede { color: var(--ink); }
  .classic .trust span::before { color: var(--pink); }
  .classic .price-stamp { background: var(--pink); color: #fff; box-shadow: 0 0 0 5px var(--sun), 0 0 0 6.5px var(--pink); }

  /* ───────── 2 · Night: the same poster, deep brown, the গুড় lit warm ───────── */
  .night { background: var(--royal); color: var(--rice); }
  .night .kick { color: var(--sun); }
  .night h1 { color: var(--rice); }
  .night h1 em { font-style: normal; color: var(--sun); }
  .night .lede { color: rgba(250, 244, 234, 0.82); }
  .night .trust { color: rgba(250, 244, 234, 0.9); }
  .night .trust span::before { color: var(--sun); }
  .night .art::before { content: ""; position: absolute; inset: 6% 4% 14% 10%; border-radius: 50%; background: radial-gradient(closest-side, rgba(246, 184, 38, 0.55), rgba(246, 184, 38, 0.18) 55%, transparent); }
  .night .art img { position: relative; filter: drop-shadow(0 26px 26px rgba(0, 0, 0, 0.45)); }
  .night .price-stamp { background: var(--sun); color: var(--royal); box-shadow: 0 0 0 5px var(--royal), 0 0 0 6.5px var(--sun); }

  /* ───────── 3 · Layered: one giant word, the photo standing in front of it ───────── */
  .layer { background: var(--sun); color: var(--royal); text-align: center; overflow: hidden; padding-top: 18px; }
  .layer .kick { color: var(--pink); font-size: clamp(24px, 5vw, 38px); display: inline-block; transform: rotate(-5deg); }
  .layer .pre { display: block; font-family: var(--disp); font-weight: 900; font-size: clamp(28px, 6vw, 56px); line-height: 1.2; margin: 4px 0 6px; }
  .layer .word-w { position: relative; z-index: 1; }
  .layer .giant { margin: 0; font-family: var(--disp); font-weight: 900; font-size: clamp(92px, 27vw, 290px); line-height: 1; letter-spacing: -0.03em; white-space: nowrap; }
  .layer .art-w { position: relative; z-index: 2; width: min(96%, 760px); margin: clamp(-130px, -12vw, -44px) auto 0; }
  .layer .art-w img { width: 100%; filter: drop-shadow(0 26px 24px rgba(58, 29, 15, 0.3)); }
  .layer .price-stamp { left: auto; right: 2%; top: 4%; background: var(--pink); color: #fff; box-shadow: 0 0 0 5px var(--sun), 0 0 0 6.5px var(--pink); }
  .layer .foot { position: relative; z-index: 3; display: grid; justify-items: center; gap: 14px; padding: 0 18px 34px; margin-top: -10px; }
  .layer .lede { margin: 0; max-width: 34ch; font-size: 15.5px; line-height: 1.7; font-weight: 500; color: var(--ink); }
  .layer .trust { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 13px; font-weight: 600; }
  .layer .trust span::before { content: "✓ "; color: var(--pink); }
  /* Depth on scroll: as the hero leaves, the word sinks and the photo lifts — the browser drives it, no JS. */
  @supports (animation-timeline: scroll()) {
    @media (prefers-reduced-motion: no-preference) {
      .layer .word-w { animation: sink linear both; animation-timeline: scroll(root); animation-range: 0 640px; }
      .layer .art-w { animation: lift linear both; animation-timeline: scroll(root); animation-range: 0 640px; }
    }
  }
  @keyframes sink { to { translate: 0 70px; } }
  @keyframes lift { to { translate: 0 -40px; } }

  /* ───────── 4 · Campaigns: swipe between seasonal posters ───────── */
  .camps { position: relative; }
  .camp-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .camp-track::-webkit-scrollbar { display: none; }
  .camp { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; color: var(--royal); }
  .camp .kick { color: var(--pink); }
  .camp .lede { color: var(--ink); }
  .camp .trust span::before { color: var(--pink); }
  .camp .wrap { padding-bottom: 46px; }
  .camp .art { margin-bottom: -6%; }
  .c-gur { background: var(--sun); }
  .c-bori { background: #efb3a8; }
  .c-achar { background: #f6cfa0; }
  .c-gur .price-stamp, .c-achar .price-stamp { background: var(--pink); color: #fff; box-shadow: 0 0 0 5px var(--bg), 0 0 0 6.5px var(--pink); }
  .c-bori .price-stamp { background: var(--royal); color: var(--rice); box-shadow: 0 0 0 5px var(--bg), 0 0 0 6.5px var(--royal); }
  .camp-dots { position: absolute; z-index: 3; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(255, 253, 248, 0.7); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .camp-dots button { width: 8px; height: 8px; border-radius: 99px; background: rgba(91, 45, 23, 0.3); transition: width 250ms var(--ease-out), background-color 200ms ease; }
  .camp-dots button.on { width: 22px; background: var(--royal); }
  .camp-dots button::after { content: ""; position: absolute; inset: -10px -4px; }
  .camp-dots button { position: relative; }
  .camp-arrow { display: none; position: absolute; z-index: 3; top: 50%; width: 46px; height: 46px; margin-top: -23px; border-radius: 50%; background: var(--paper); color: var(--royal); place-items: center; box-shadow: 0 8px 20px -10px rgba(58, 29, 15, 0.5); }
  .camp-arrow.to-prev { left: 16px; } .camp-arrow.to-next { right: 16px; }
  @media (min-width: 860px) and (hover: hover) { .camp-arrow { display: grid; } }

  /* ───────── 5 · Memo: the poster as a pinned cash memo, like the footer ───────── */
  .memo-hero { padding: 28px 0 10px; }
  .mh-w { position: relative; max-width: 1040px; margin: 0 auto; rotate: -0.6deg; filter: drop-shadow(0 1px 1px rgba(58, 58, 62, 0.2)) drop-shadow(0 10px 16px rgba(58, 58, 62, 0.1)) drop-shadow(0 26px 34px rgba(58, 58, 62, 0.07)); }
  .tack { position: absolute; z-index: 5; top: -8px; left: 50%; width: 20px; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; --pc: #d2342a;
    background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.95) 0 9%, rgba(255, 255, 255, 0) 26%), radial-gradient(circle at 50% 50%, var(--pc) 0 58%, color-mix(in srgb, var(--pc) 62%, #000) 100%);
    box-shadow: inset -1.5px -2px 2px rgba(0, 0, 0, 0.25), inset 1px 1px 1px rgba(255, 255, 255, 0.35), 3px 5px 4px -1px rgba(40, 20, 8, 0.45); }
  .mh { position: relative; background-color: #fffdf6; background-image: repeating-linear-gradient(180deg, transparent 0 25px, rgba(70, 110, 170, 0.18) 25px 26px); padding: 24px 18px 40px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), 97.5% 100%, 95.0% calc(100% - 10px), 92.5% 100%, 90.0% calc(100% - 10px), 87.5% 100%, 85.0% calc(100% - 10px), 82.5% 100%, 80.0% calc(100% - 10px), 77.5% 100%, 75.0% calc(100% - 10px), 72.5% 100%, 70.0% calc(100% - 10px), 67.5% 100%, 65.0% calc(100% - 10px), 62.5% 100%, 60.0% calc(100% - 10px), 57.5% 100%, 55.0% calc(100% - 10px), 52.5% 100%, 50.0% calc(100% - 10px), 47.5% 100%, 45.0% calc(100% - 10px), 42.5% 100%, 40.0% calc(100% - 10px), 37.5% 100%, 35.0% calc(100% - 10px), 32.5% 100%, 30.0% calc(100% - 10px), 27.5% 100%, 25.0% calc(100% - 10px), 22.5% 100%, 20.0% calc(100% - 10px), 17.5% 100%, 15.0% calc(100% - 10px), 12.5% 100%, 10.0% calc(100% - 10px), 7.5% 100%, 5.0% calc(100% - 10px), 2.5% 100%, 0.0% calc(100% - 10px)); }
  @media (min-width: 760px) { .mh { padding: 28px 40px 46px; } }
  .mh-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--royal); padding-bottom: 12px; }
  .mh-top img { height: 40px; width: auto; }
  .mh-top .ttl { text-align: center; flex: 1; }
  .mh-top .ttl b { display: block; font-family: var(--disp); font-weight: 900; font-size: clamp(18px, 3vw, 26px); color: var(--royal); }
  .mh-top .ttl span { font-size: 12px; color: var(--sub); }
  .mh-top .no { font-size: 12px; color: var(--sub); text-align: right; }
  .mh-top .no b { font-size: 18px; color: var(--pink); font-variant-numeric: tabular-nums; }
  .mh-body { display: grid; gap: 6px; margin-top: 14px; align-items: center; }
  @media (min-width: 860px) { .mh-body { grid-template-columns: 1.1fr 1fr; gap: 30px; } }
  .mh .kick { color: var(--pink); font-size: clamp(22px, 4.6vw, 32px); display: inline-block; transform: rotate(-4deg); }
  .mh h1 { margin: 0; font-family: var(--disp); font-weight: 900; color: var(--royal); font-size: clamp(46px, 11vw, 96px); line-height: 1; letter-spacing: -0.02em; }
  .mh-rows { margin: 14px 0 0; padding: 0; list-style: none; max-width: 420px; }
  .mh-rows li { display: flex; align-items: baseline; gap: 8px; height: 26px; line-height: 26px; font-family: var(--disp); font-weight: 700; font-size: 16px; color: var(--royal); }
  .mh-rows li::after { content: ""; order: 1; flex: 1; border-bottom: 1.5px dotted rgba(58, 29, 15, 0.35); transform: translateY(-6px); }
  .mh-rows li em { order: 2; font-style: normal; font-variant-numeric: tabular-nums; }
  .batch { margin: 18px 0 20px; max-width: 420px; }
  .batch-lbl { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--royal); }
  .batch-lbl b { color: var(--pink); font-variant-numeric: tabular-nums; }
  .batch-bar { height: 8px; margin-top: 6px; border-radius: 99px; background: rgba(91, 45, 23, 0.12); overflow: hidden; }
  .batch-bar i { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--sun), var(--pink)); transform-origin: left; transform: scaleX(0.64); animation: fill-in 1000ms var(--ease-out) 400ms both; }
  @keyframes fill-in { from { transform: scaleX(0); } }
  .mh-art { position: relative; }
  .mh-art img { width: 100%; max-width: 520px; margin: 0 auto; filter: drop-shadow(0 18px 18px rgba(58, 29, 15, 0.22)); }
  .rubber { position: absolute; z-index: 2; left: 2%; top: 2%; width: 104px; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--pink); color: var(--pink); display: grid; place-items: center; text-align: center; font-family: var(--disp); font-weight: 700; font-size: 12px; line-height: 1.3; transform: rotate(14deg); opacity: 0.85; box-shadow: inset 0 0 0 4px #fffdf6, inset 0 0 0 5.5px var(--pink); }

  @media (prefers-reduced-motion: reduce) {
    [data-in], [data-settle] { animation-name: fade !important; animation-duration: 160ms !important; animation-delay: 0ms !important; }
    @keyframes fade { from { opacity: 0; } }
    .batch-bar i { animation: none; }
    .camp-track { scroll-behavior: auto; }
  }

  /* ── Picker: verbatim from emilkowalski/skills prototype/PICKER.md. Top, because the phone dock owns bottom-center. ── */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Classic</button>
  <button class="proto-picker-item">Night</button>
  <button class="proto-picker-item">Layered</button>
  <button class="proto-picker-item">Campaigns</button>
  <button class="proto-picker-item">Memo</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const CUT = "../2026-10-13-homepage/cutouts/";
const PUBLIC = "../../../client/public";
const LOGO = "../../../attached_assets/sera-khabar-leaf-logo.webp";
const bn = (v) => String(v).replace(/\d/g, (d) => "০১২৩৪৫৬৭৮৯"[d]);
const ICON = {
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>',
  bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',

const CAMPAIGNS = [
  { cls: "c-gur", bg: "#f6b826", ...GUR },
  { cls: "c-bori", bg: "#efb3a8", kick: "রোদে শুকানো", title: "কুমড়ো<br>বড়ি", lede: "মায়ের রেসিপিতে ঘরে বানানো। ভাজলে মচমচে, ঝোলে দিলে নরম।", price: 700, art: `${CUT}bori-cut.webp` },

const campaigns = {
  html: () => `<section class="camps">
    <div class="camp-track">${CAMPAIGNS.map((c) => `<article class="pst camp ${c.cls}" style="--bg:${c.bg}">${posterBody(c)}</article>`).join("")}</div>
    <button class="camp-arrow to-prev press" aria-label="আগের">${ICON.left}</button>
    <button class="camp-arrow to-next press" aria-label="পরের">${ICON.right}</button>
    <div class="camp-dots">${CAMPAIGNS.map((c, i) => `<button aria-label="${i + 1}"${i ? "" : ' class="on"'}></button>`).join("")}</div>
  </section>`,
  init(root) {
    // Native scroll-snap does the swiping; this only keeps the dots in step and wires the arrows.
    const track = root.querySelector(".camp-track");
    const slides = [...track.children];
    const dots = [...root.querySelectorAll(".camp-dots button")];
    let at = 0;
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (!e.isIntersecting) return;
      at = slides.indexOf(e.target);
      dots.forEach((d, i) => d.classList.toggle("on", i === at));
    }), { root: track, threshold: 0.6 });
    slides.forEach((s) => io.observe(s));
    const smooth = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
    const show = (i) => track.scrollTo({ left: slides[(i + slides.length) % slides.length].offsetLeft, behavior: smooth });
    dots.forEach((d, i) => d.addEventListener("click", () => show(i)));
    root.querySelector(".camp-arrow.to-prev").addEventListener("click", () => show(at - 1));
    root.querySelector(".camp-arrow.to-next").addEventListener("click", () => show(at + 1));
  },
};

const VARIANTS = [classic, night, layered, campaigns, memo];

/* ── Mount ── */
const stage = document.getElementById("stage");
function mount(i) {
  stage.innerHTML = "";
  window.scrollTo(0, 0);
  requestAnimationFrame(() => {
    stage.innerHTML = chrome(VARIANTS[i].html());
    VARIANTS[i].init?.(stage);
  });
}
stage.addEventListener("click", (e) => { if (e.target.closest('a[href="#"]')) e.preventDefault(); });

/* ── Picker wiring: verbatim behavior contract from PICKER.md ── */
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
const replay = picker.querySelector(".proto-picker-replay");
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function setActive(i) {
  if (i < 0 || i >= VARIANTS.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set("v", i + 1);
  history.replaceState(null, "", url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay?.addEventListener("click", () => mount(current));
window.addEventListener("resize", moveHighlight);

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= VARIANTS.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % VARIANTS.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + VARIANTS.length) % VARIANTS.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
