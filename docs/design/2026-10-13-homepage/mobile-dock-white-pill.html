<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF4EA">
<title>White Pill Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atma:wght@700&family=Galada&family=Hind+Siliguri:wght@400;600;700&family=Noto+Serif+Bengali:wght@700;900&display=swap">
<style>
/*
 * Mobile dock, round 4: the "Scroll" white compact pill, always fixed at the bottom (after Emil Kowalski's `prototype` skill).
 * Five directions, each on a different axis. One renders at a time, full phone width, over a real page.
 * Flip with the picker (top), keys 1–5, ← →, R to replay.
 */
:root{
  --rice:#FAF4EA;--royal:#5B2D17;--sun:#F6B826;--pink:#E2547A;--card:#F1E5D3;--ink:#3A1D0F;--sub:#7A6050;--paper:#FFFDF8;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;background:#E8DFD2}
body{margin:0;font-family:"Hind Siliguri",sans-serif;color:var(--ink)}
.num{font-family:"Atma",sans-serif;font-weight:700}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--pink);outline-offset:3px}

/* the phone-width page every variant sits on */
.col{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--rice);padding-bottom:120px;position:relative}
.top{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 18px;background:var(--rice)}
.top img{height:44px;justify-self:center}
.hero{padding:6px 18px 18px;position:relative}
.hero h1{margin:0;font-family:"Noto Serif Bengali",serif;font-weight:900;color:var(--royal);font-size:86px;line-height:.9;letter-spacing:-.02em}
.hero .tag{position:absolute;left:48%;top:0;font-family:"Galada",cursive;color:var(--pink);font-size:28px;transform:rotate(-8deg)}
.hero p{margin:14px 0 0;max-width:30ch;color:var(--royal);font-size:14.5px}
.sec{padding:20px 18px}
.sec h2{margin:0 0 14px;font-family:"Noto Serif Bengali",serif;font-weight:700;color:var(--royal);font-size:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.card img{width:100%;aspect-ratio:1;object-fit:contain}
.card b{font-family:"Noto Serif Bengali",serif;font-size:14px;line-height:1.35}
.card small{color:var(--sub);font-size:12px}
.buy{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.buy .num{font-size:19px;color:var(--royal)}
.plus{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--royal);color:#fff;font-size:20px;line-height:1;transition:transform 160ms var(--ease-out),background-color 160ms ease}
.plus:active{transform:scale(.97)}
.plus.added{background:var(--pink)}
.plus span{grid-area:1/1;transition:opacity 200ms var(--ease-out),filter 200ms var(--ease-out),transform 200ms var(--ease-out)}
.plus .l2{opacity:0;filter:blur(2px);transform:translateY(4px);font-size:14px}
.plus.added .l1{opacity:0;filter:blur(2px);transform:translateY(-4px)}
.plus.added .l2{opacity:1;filter:none;transform:none}
.note{margin:24px 18px 0;padding:14px 16px;border-radius:18px;background:var(--paper);font-size:13px;color:var(--sub);line-height:1.6}

/* every dock is fixed to the bottom of the phone column */
.dock{position:fixed;z-index:20;left:50%;bottom:0;width:min(100%,430px);transform:translateX(-50%)}
.dock svg{width:22px;height:22px;display:block}
.press{transition:transform 160ms var(--ease-out),color 160ms ease,background-color 160ms ease}
.press:active{transform:scale(.97)}
.badge{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--pink);color:#fff;display:inline-grid;place-items:center;font-size:12px;line-height:1}
.bump{animation:bump 300ms var(--ease-out)}
@keyframes bump{40%{transform:scale(1.18)}}

/* ===== White compact pill (the "Scroll" design), always fixed at the bottom ===== */
.wp{bottom:calc(14px + var(--safe-b));display:flex;justify-content:center}
.wp-pill{position:relative;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:var(--paper);
  box-shadow:0 0 0 1px rgba(58,29,15,.06),0 1px 2px rgba(58,29,15,.04),0 4px 8px -2px rgba(58,29,15,.05),0 14px 28px -8px rgba(58,29,15,.14)}
.wp-pill button{position:relative;z-index:1;height:48px;min-width:48px;padding:0 13px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--sub);
  font-family:"Noto Serif Bengali",serif;font-weight:700;font-size:12.5px;white-space:nowrap}
.wp-pill button svg{flex:none}
.wp-pill .cart{background:var(--sun);color:var(--ink);margin-left:4px;padding:0}
.wp-pill .cart .badge{position:absolute;top:-2px;right:-2px;box-shadow:0 0 0 2px var(--paper)}
.wp-pill .lbl{display:none}
/* the sliding highlight behind the active tab */
.wp-hl{position:absolute;z-index:0;top:6px;left:0;height:48px;border-radius:999px;background:var(--card)}
.wp[data-ready] .wp-hl{transition:transform 220ms var(--ease-out),width 220ms var(--ease-out)}
.wp-pill button[aria-current]{color:var(--royal)}

/* A · Classic: exactly the Scroll look, cream circle behind the active icon */
/* B · Label: the active tab shows its name next to the icon */
.wp.label .wp-pill button[aria-current] .lbl{display:inline}
/* C · Tamarind ink: the highlight is tamarind, active icon and name in cream */
.wp.dark .wp-hl{background:var(--royal)}
.wp.dark .wp-pill button[aria-current]{color:var(--rice)}
.wp.dark .wp-pill button[aria-current] .lbl{display:inline}
/* D · Dot: no fill, the active icon turns tamarind with a small pink dot under it */
.wp.dot .wp-hl{display:none}
.wp.dot .wp-pill button[aria-current]::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--pink);transform:translateX(-50%)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Picker (verbatim from emilkowalski/skills prototype/PICKER.md) ===== */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,0.85)}
.proto-picker-item:active{transform:scale(0.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,0.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
</style>
</head>
<body>
<nav class="proto-picker" aria-label="Prototype variants" data-position="top">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Classic</button>
  <button class="proto-picker-item">Label</button>
  <button class="proto-picker-item">Tamarind</button>
  <button class="proto-picker-item">Dot</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<div class="col" id="page"></div>
<div id="stage"></div>

<script>
const IC={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>',
 bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/><path d="M5.2 8h13.6l-1 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4-4"/></svg>',
 menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>'
};
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const TABS=[["home","হোম"],["shop","পণ্য"],["search","খুঁজুন"],["menu","মেনু"]];
const PRODUCTS=[
 ["খেজুরের পাটালী গুড়","৫০০ গ্রাম",350,"cutouts/g-patali.webp"],["খেজুরের পাটালী গুড়","১ কেজি",650,"cutouts/g-patali.webp"],
 ["খেজুরের ঝোলা গুড়","৫০০ গ্রাম",380,"cutouts/g-jhola.webp"],["দানাদার গুড়","৫০০ গ্রাম",300,"cutouts/g-dana.webp"],
 ["হোমমেড কুমড়ো বড়ি","১ কেজি",700,"cutouts/homemade-cut.webp"],["আমসত্ত্ব আচার","৫০০ গ্রাম",350,"cutouts/achar-cut.webp"]];
const S={tab:"home",items:[[0,1],[3,1]]}; // [productIndex, qty]
const count=()=>S.items.reduce((a,[,q])=>a+q,0);
const total=()=>S.items.reduce((a,[i,q])=>a+PRODUCTS[i][2]*q,0);
const badge=()=>count()?`<span class="badge num" data-badge>${bn(count())}</span>`:"";
const cur=k=>S.tab===k?' aria-current="page"':"";

document.getElementById("page").innerHTML=`
 <header class="top"><span></span><img src="../../../attached_assets/sera-khabar-leaf-logo.webp" alt="সেরা খাবার"><span></span></header>
 <section class="hero"><span class="tag">রাজশাহী থেকে</span><h1>সেরা<br>খাবার</h1><p>ঘরে বানানো বড়ি, আচার আর গুড়। মায়ের রেসিপি, ছোট ব্যাচ, সারাদেশে ডেলিভারি।</p></section>
 <section class="sec"><h2>আমাদের গুড়</h2><div class="grid">${PRODUCTS.map((p,i)=>`<article class="card"><img src="${p[3]}" alt=""><b>${p[0]}</b><small>${p[1]}</small><div class="buy"><span class="num">৳${bn(p[2])}</span><button class="plus" data-add="${i}" aria-label="${p[0]} ${p[1]} কার্টে যোগ করুন"><span class="l1">+</span><span class="l2">✓</span></button></div></article>`).join("")}</div></section>
 <p class="note">The dock stays put while you scroll. Tap the tabs and +. Every dock opens the same things the current one does: cart drawer, search, menu.</p>
 <section class="sec"><h2>আমাদের হোমমেড</h2><div class="grid">${PRODUCTS.slice(4).concat(PRODUCTS.slice(0,2)).map(p=>`<article class="card"><img src="${p[3]}" alt=""><b>${p[0]}</b><small>${p[1]}</small><div class="buy"><span class="num">৳${bn(p[2])}</span></div></article>`).join("")}</div></section>`;

function pill(cls){
  return `<nav class="dock wp ${cls}" aria-label="Mobile navigation"><div class="wp-pill"><span class="wp-hl" aria-hidden="true"></span>
    ${TABS.map(([k,l])=>`<button class="press" data-tab="${k}"${cur(k)} aria-label="${l}">${IC[k]}<span class="lbl">${l}</span></button>`).join("")}
    <button class="cart press" data-cart aria-label="কার্ট">${IC.bag}${badge()}</button></div></nav>`}
const variants=[()=>pill(""),()=>pill("label"),()=>pill("dark"),()=>pill("dot")];

/* slide the highlight under the active tab */
function settle(){
  const d=document.querySelector(".wp");if(!d)return;
  const on=d.querySelector("[aria-current]"),hl=d.querySelector(".wp-hl");if(!on)return;
  hl.style.width=on.offsetWidth+"px";hl.style.transform=`translateX(${on.offsetLeft}px)`}
function ready(){requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelector(".dock")?.setAttribute("data-ready","")))}

/* re-render the dock in place (state change) without re-running its entrance */
function redraw(){const old=document.querySelector(".dock");if(!old)return;const t=document.createElement("div");t.innerHTML=variants[current]();const nu=t.firstElementChild;
  for(const a of ["data-ready","data-hidden","data-compact"])if(old.hasAttribute(a))nu.setAttribute(a,"");
  old.replaceWith(nu);settle()}

document.addEventListener("click",e=>{
  const add=e.target.closest("[data-add]");
  if(add){const i=+add.dataset.add,row=S.items.find(r=>r[0]===i);row?row[1]++:S.items.push([i,1]);
    add.classList.add("added");clearTimeout(add._t);add._t=setTimeout(()=>add.classList.remove("added"),1400);
    redraw();
    document.querySelector("[data-badge]")?.classList.add("bump");return}
  const tab=e.target.closest(".dock [data-tab]");if(tab){S.tab=tab.dataset.tab;redraw();return}
  const cart=e.target.closest(".dock [data-cart]");if(cart){cart.animate?.([{transform:"scale(.97)"},{transform:"none"}],{duration:160,easing:"cubic-bezier(0.23,1,0.32,1)"})}
});

addEventListener("resize",settle);

/* ===== Picker wiring (verbatim behaviour from PICKER.md) ===== */
const stage=document.getElementById('stage');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');
let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();settle();ready()})}
function setActive(i){if(i<0||i>=variants.length)return;current=i;
  items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});
  moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
replay?.addEventListener('click',()=>mount(current));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',(e)=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const num=parseInt(e.key,10);
  if(num>=1&&num<=variants.length)setActive(num-1);
  else if(e.key==='ArrowRight')setActive((current+1)%variants.length);
  else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);
  else if(e.key==='r'||e.key==='R')mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
</html>
