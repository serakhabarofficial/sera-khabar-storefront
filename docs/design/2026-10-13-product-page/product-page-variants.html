<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product page round 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atma:wght@700&family=Galada&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700;900&display=swap" rel="stylesheet">
<!--
  Product page, round 3 (2026-10-13). Emil Kowalski's `prototype` skill: one variant at a time, real page
  context, picker verbatim from PICKER.md. Direction from the owner's references (structured two-column
  product pages: photo panel + clear info column, benefit bullets, size cards with badges, accordions,
  colour bands, trust strip, "you might like" row), dressed only in homepage parts: section headings with
  a Galada line, homepage product cards, the গুড় ad band, the FAQ chat and the cash-memo footer.
  Rounds 1–2 are kept in product-page-variants-round1-2.html. Round 5: Classic + Chips memo chosen; only the delivery estimate varies. Earlier rounds are kept in
  product-page-variants-round1-2 / -round3 / -round4.html. Keys: 1–4 or ←/→, R replays.
-->
<style>
  :root {
    --rice: #faf4ea; --royal: #5b2d17; --sun: #f6b826; --pink: #e2547a; --card: #f1e5d3;
    --ink: #3a1d0f; --sub: #7a6050; --paper: #fffdf8; --rose: #e9a9a0; --blush: #fbe3df; --butter: #fdf0cf;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --disp: "Noto Serif Bengali", serif;
    --soft: 0 0 0 1px rgba(58,29,15,.06), 0 1px 2px rgba(58,29,15,.04), 0 4px 8px -2px rgba(58,29,15,.05), 0 14px 28px -8px rgba(58,29,15,.08);
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #e9dfd0; font-family: "Hind Siliguri", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button, a { font: inherit; color: inherit; text-decoration: none; touch-action: manipulation; }
  button { border: 0; background: none; padding: 0; cursor: pointer; user-select: none; -webkit-user-select: none; }
  img { display: block; max-width: 100%; }
  .num { font-family: "Atma", sans-serif; font-weight: 700; }
  .script { font-family: "Galada", cursive; font-weight: 400; }
  .press { transition: transform 160ms var(--ease-out), background-color 160ms ease, color 160ms ease, box-shadow 160ms ease; }
  .press:active { transform: scale(0.97); }
  /* Product photos have white backgrounds: they sit on cream and blend in (homepage rule) */
  .blend { mix-blend-mode: multiply; -webkit-mask-image: radial-gradient(ellipse 66% 66% at 50% 50%, #000 58%, transparent 100%); mask-image: radial-gradient(ellipse 66% 66% at 50% 50%, #000 58%, transparent 100%); }

  /* ── Stage ── */
  .stage-mode { position: fixed; top: 24px; left: 24px; z-index: 2147483646; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(10,10,10,.82); color: rgba(255,255,255,.85); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; backdrop-filter: blur(12px); }
  #stage { min-height: 100dvh; display: grid; place-items: center; padding: 76px 16px 24px; }
  .scroller { position: relative; width: 390px; height: min(844px, calc(100dvh - 100px)); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; border-radius: 44px; background: var(--rice); box-shadow: 0 0 0 10px #2a1c14, 0 30px 60px -20px rgba(42,28,20,.5); scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  body.full #stage { padding: 0; display: block; }
  body.full .scroller { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  @media (max-width: 440px) { #stage { padding: 0; display: block; } .scroller { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; } .stage-mode { display: none; } }

  /* ── Homepage chrome ── */
  .pg { container: pg / inline-size; min-height: 100%; background: var(--rice); }
  .w { padding-inline: 18px; }
  @container pg (min-width: 760px) { .w { padding-inline: 48px; } }
  .ann { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 16px; background: var(--sun); text-align: center; }
  .ann div { display: flex; flex-direction: column; line-height: 1.2; }
  .ann .script { color: var(--pink); font-size: 15px; }
  .ann b { font-size: 12.5px; }
  .ann a { flex: none; height: 28px; padding: 0 12px; border-radius: 999px; background: var(--royal); color: var(--rice); font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .ann a i { width: 6px; height: 6px; border-radius: 50%; background: var(--sun); }
  @container pg (min-width: 760px) { .ann div { flex-direction: row; gap: 12px; align-items: baseline; } }
  .hdr { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 8px; background: var(--rice); }
  .hdr .mb { width: 34px; height: 34px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; }
  .hdr .mb span { width: 14px; height: 1.5px; background: #000; box-shadow: 0 -4px 0 #000, 0 4px 0 #000; }
  .hdr .links { display: none; gap: 18px; font-size: 13px; font-weight: 600; color: var(--royal); }
  .hdr img { height: 46px; }
  .hdr .bag { justify-self: end; width: 34px; height: 34px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; font-size: 15px; color: var(--royal); }
  .hdr .bag.pulse { animation: pulse 420ms var(--ease-out); }
  @keyframes pulse { 40% { transform: scale(1.18); } }
  @container pg (min-width: 760px) { .hdr .mb { display: none; } .hdr .links { display: flex; } .hdr img { height: 58px; } }
  .crumb { display: flex; align-items: center; gap: 6px; padding-top: 4px; font-size: 12.5px; color: var(--sub); }
  .crumb a { color: var(--royal); font-weight: 600; }
  /* Homepage section heading: big Noto title, pink Galada line under it */
  .hh { text-align: center; margin-bottom: 22px; }
  .hh h2 { margin: 0; font-family: var(--disp); font-weight: 900; font-size: clamp(26px, 4.6cqi, 44px); line-height: 1.15; color: var(--royal); }
  .hh .script { display: block; width: max-content; margin: 2px auto 0; color: var(--pink); font-size: clamp(18px, 2.8cqi, 26px); transform: rotate(-4deg); }
  /* Homepage product card */
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  @container pg (min-width: 760px) { .cards { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 22px; } }
  .pc { background: var(--card); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
  .pc img { width: 100%; max-width: 160px; aspect-ratio: 1; object-fit: contain; }
  .pc b { font-family: var(--disp); font-weight: 700; font-size: 15px; line-height: 1.4; }
  .pc .buy { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .pc .num { font-size: 20px; color: var(--royal); }
  .pc .plus { width: 36px; height: 36px; border-radius: 50%; background: var(--royal); color: #fff; font-size: 20px; line-height: 1; }
  /* Cash-memo footer (compact) */
  .memo-foot { margin-top: 56px; padding-bottom: 96px; }
  @container pg (min-width: 760px) { .memo-foot { padding-bottom: 40px; } }
  .memo-foot .m { position: relative; max-width: 760px; margin: 0 auto; padding: 24px 20px 30px; background: var(--paper); border-radius: 6px 6px 0 0; box-shadow: 0 0 0 1px rgba(58,29,15,.06), 0 14px 28px -10px rgba(58,29,15,.18); }
  .memo-foot .m::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 12px; background: radial-gradient(circle at 8px 0, var(--paper) 8px, transparent 8.5px) 0 0 / 16px 12px repeat-x; }
  .memo-foot .pin { position: absolute; top: -9px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--pink); box-shadow: inset -3px -3px 0 rgba(0,0,0,.15), 0 3px 4px rgba(58,29,15,.3); }
  .memo-foot .mh { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 2px solid var(--royal); }
  .memo-foot .mh img { width: 40px; }
  .memo-foot .mh b { flex: 1; font-family: var(--disp); font-weight: 900; font-size: 22px; color: var(--royal); }
  .memo-foot .mh span { font-size: 12.5px; color: var(--sub); }
  .memo-foot .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; padding-top: 12px; }
  .memo-foot .cols a { display: flex; align-items: baseline; gap: 6px; padding: 6px 0; font-family: var(--disp); font-weight: 700; font-size: 15px; color: var(--royal); }
  .memo-foot .cols a i { flex: 1; border-bottom: 2px dotted rgba(91,45,23,.3); }
  .memo-foot .stamp { position: absolute; right: 18px; bottom: 22px; padding: 6px 10px; border: 2px solid var(--pink); border-radius: 6px; color: var(--pink); font-weight: 700; font-size: 12px; line-height: 1.25; text-align: center; transform: rotate(-9deg); opacity: .85; background: var(--paper); }
  .memo-foot .copy { margin-top: 26px; text-align: center; font-size: 12px; color: var(--sub); }
  .dock { position: sticky; bottom: 12px; z-index: 30; margin: 0 auto; width: calc(100% - 32px); height: 60px; display: flex; align-items: center; justify-content: space-around; border-radius: 999px; background: #fff; box-shadow: 0 10px 30px -10px rgba(42,28,20,.35), 0 0 0 1px rgba(58,29,15,.06); }
  .dock span { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--sub); }
  .dock span i { width: 20px; height: 20px; border-radius: 6px; border: 1.6px solid currentColor; }
  .dock span.on { color: var(--royal); font-weight: 700; }
  @container pg (min-width: 760px) { .dock { display: none; } }
  .toast { position: sticky; bottom: 96px; z-index: 40; height: 0; display: flex; justify-content: center; pointer-events: none; }
  .toast span { transform: translateY(-100%); padding: 10px 16px; border-radius: 999px; background: var(--royal); color: var(--rice); font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
  .toast.show span { opacity: 1; transform: translateY(calc(-100% - 6px)); }

  /* ── Shared buy controls ── */
  .qty { display: inline-flex; align-items: center; height: 50px; padding: 0 5px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1.5px rgba(58,29,15,.16); }
  .qty button { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--royal); }
  .qty button:disabled { opacity: .35; cursor: not-allowed; }
  .qty output { min-width: 28px; text-align: center; font-family: "Atma", sans-serif; font-weight: 700; font-size: 18px; }
  .cod { display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; padding: 0 22px; border-radius: 999px; background: var(--sun); color: var(--ink); font-weight: 700; font-size: 16px; }
  .cod i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--pink); }
  .addc { display: grid; place-items: center; height: 56px; padding: 0 20px; border-radius: 999px; color: var(--royal); box-shadow: inset 0 0 0 1.5px var(--royal); font-weight: 700; font-size: 15px; }
  .addc > span { grid-area: 1 / 1; transition: opacity 200ms var(--ease-out), filter 200ms var(--ease-out), transform 200ms var(--ease-out); }
  .addc .l2 { opacity: 0; filter: blur(2px); transform: translateY(4px); }
  .addc.added .l1 { opacity: 0; filter: blur(2px); transform: translateY(-4px); }
  .addc.added .l2 { opacity: 1; filter: none; transform: none; }
  .truck { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .truck svg { flex: none; width: 22px; height: 22px; color: var(--royal); }
  .truck b { font-family: var(--disp); color: var(--royal); }
  .rise > * { animation: rise 380ms var(--ease-out) both; }
  .rise > *:nth-child(2) { animation-delay: 50ms; } .rise > *:nth-child(3) { animation-delay: 100ms; } .rise > *:nth-child(4) { animation-delay: 150ms; } .rise > *:nth-child(n+5) { animation-delay: 200ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (hover: hover) and (pointer: fine) { .cod:hover { background: #efad12; } .addc:hover { background: rgba(91,45,23,.06); } }
  @media (prefers-reduced-motion: reduce) { .rise > * { animation: none; } .press:active { transform: none; } .toast span { transition: opacity 200ms ease; } }

  /* ═════════ 1 · Classic — axis: conventional two-column shop page (Salvida reference) ═════════ */
  .k1 .top { display: flex; flex-direction: column; gap: 18px; padding-top: 12px; }
  .k1 .left { display: contents; }
  .k1 .photo { order: 1; } .k1 .info { order: 2; } .k1 .acc { order: 3; }
  .k1 .photo { position: relative; border-radius: 28px; background: var(--card); padding: 30px 20px 22px; }
  .k1 .photo img { width: 88%; margin: 0 auto; }
  .k1 .chip { position: absolute; top: 16px; left: 16px; padding: 4px 12px; border-radius: 999px; background: var(--rose); font-family: var(--disp); font-weight: 700; font-size: 13px; }
  .k1 .seal { position: absolute; top: 14px; right: 14px; width: 82px; height: 82px; border-radius: 50%; background: var(--paper); box-shadow: var(--soft); display: grid; place-items: center; text-align: center; transform: rotate(-10deg); }
  .k1 .seal > span { width: 70px; height: 70px; border-radius: 50%; border: 1.5px dashed var(--pink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
  .k1 .seal b { font-family: var(--disp); font-weight: 900; font-size: 15px; color: var(--royal); }
  .k1 .seal small { font-size: 10px; color: var(--pink); font-weight: 700; }
  .k1 .info { display: flex; flex-direction: column; gap: 14px; }
  .k1 h1 { margin: 0; font-family: var(--disp); font-weight: 900; font-size: 34px; line-height: 1.2; color: var(--royal); }
  .k1 .pill { align-self: flex-start; margin-top: -6px; padding: 3px 11px; border-radius: 999px; background: var(--blush); font-size: 12.5px; font-weight: 600; color: var(--royal); }
  .k1 .tagl { margin: -4px 0 -6px; color: var(--pink); font-size: 18px; transform: rotate(-3deg); transform-origin: left; }
  .k1 .lede { margin: 0; font-size: 14px; line-height: 1.65; color: var(--ink); }
  .k1 .ticks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .k1 .ticks li { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .k1 .ticks li::before { content: "✓"; flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: var(--royal); font-size: 10.5px; font-weight: 700; }
  .k1 .price { font-size: 40px; line-height: 1; color: var(--royal); }
  .k1 .lbl { font-family: var(--disp); font-weight: 700; font-size: 16px; color: var(--royal); }
  .k1 .sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 10px; }
  .k1 .size { position: relative; display: flex; align-items: center; gap: 10px; padding: 18px 12px 12px; border-radius: 18px; background: var(--paper); box-shadow: inset 0 0 0 1.5px rgba(58,29,15,.16); text-align: left; }
  .k1 .size[aria-pressed="true"] { background: var(--butter); box-shadow: inset 0 0 0 2px var(--royal); }
  .k1 .size .badge { position: absolute; top: -10px; left: 10px; right: 10px; padding: 3px 0; border-radius: 8px; text-align: center; font-size: 11px; font-weight: 700; color: var(--paper); background: var(--royal); }
  .k1 .size .badge.pink { background: var(--pink); }
  .k1 .size img { flex: none; width: 42px; height: 42px; object-fit: contain; }
  .k1 .size b { display: block; font-family: var(--disp); font-weight: 900; font-size: 18px; color: var(--royal); }
  .k1 .size .num { font-size: 17px; color: var(--royal); }
  .k1 .size small { display: block; font-size: 11.5px; color: var(--sub); }
  .k1 .buyrow { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
  .k1 .strip { margin-top: 44px; overflow: hidden; background: var(--sun); padding: 13px 0; }
  .k1 .strip > div { display: flex; gap: 34px; width: max-content; animation: marquee 26s linear infinite; }
  .k1 .strip span { display: inline-flex; align-items: center; gap: 12px; font-family: var(--disp); font-weight: 900; font-size: 18px; color: var(--royal); white-space: nowrap; }
  .k1 .strip span::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--pink); }
  @keyframes marquee { to { transform: translateX(-50%); } }
  .k1 .more { padding-top: 44px; }
  @container pg (min-width: 760px) {
    .k1 .top { display: grid; grid-template-columns: 1fr 1fr; gap: 0 56px; padding-top: 22px; align-items: start; }
    .k1 .left { position: sticky; top: 92px; display: flex; flex-direction: column; gap: 22px; }
    .k1 .photo, .k1 .info, .k1 .acc { order: 0; }
    .k1 h1 { font-size: 40px; }
  }
  @media (prefers-reduced-motion: reduce) { .k1 .strip > div { animation: none; } }
  /* "অথবা" + phone / WhatsApp ordering (kept from the live page) */
  .k1 .or { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; color: var(--sub); }
  .k1 .or::before, .k1 .or::after { content: ""; flex: 1; border-top: 1.5px dotted rgba(58,29,15,.3); }
  .k1 .help { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .k1 .help a { display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 999px; font-size: 14.5px; font-weight: 700; }
  .k1 .help svg, .k1 .help img { width: 18px; height: 18px; flex: none; }
  .k1 .help .call { background: var(--royal); color: var(--rice); }
  .k1 .help .wa { background: #25d366; color: #fff; }
  .k1 .help .wa img { filter: brightness(0) invert(1); }
  @media (hover: hover) and (pointer: fine) { .k1 .help .call:hover { background: #4a2412; } .k1 .help .wa:hover { background: #1fbd5a; } }

  /* Details section — shared heading */
  .k1 .acc { display: flex; flex-direction: column; gap: 12px; }
  .k1 .dh { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
  .k1 .dh h2 { margin: 0; font-family: var(--disp); font-weight: 900; font-size: 26px; color: var(--royal); }
  .k1 .dh .script { color: var(--pink); font-size: 20px; transform: rotate(-4deg); }
  .k1 .acc .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms var(--ease-out); }
  .k1 .acc .body > div { overflow: hidden; }
  .k1 .acc [aria-expanded="true"] + .body { grid-template-rows: 1fr; }
  @media (prefers-reduced-motion: reduce) { .k1 .acc .body { transition: none; } }

  /* A · Cards — each section a coloured card, opens in place */
  .k1 .dcard { border-radius: 22px; background: var(--c); color: var(--ink); }
  .k1 .dcard[data-dark] { color: var(--rice); }
  .k1 .dcard > button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 14px 14px 12px; text-align: left; }
  .k1 .dcard .no { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--rice); color: var(--royal); font-size: 13px; }
  .k1 .dcard .t { flex: 1; min-width: 0; }
  .k1 .dcard .t b { display: block; font-family: var(--disp); font-weight: 900; font-size: 18px; line-height: 1.3; }
  .k1 .dcard .t small { display: block; font-size: 12.5px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k1 .dcard em { flex: none; font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--royal); color: var(--rice); font-size: 17px; transition: transform 200ms var(--ease-out); }
  .k1 .dcard[data-dark] em { background: var(--sun); color: var(--royal); }
  .k1 .dcard [aria-expanded="true"] em { transform: rotate(45deg); }
  .k1 .dcard .in { margin: 0 14px 14px; padding: 14px; border-radius: 16px; background: rgba(255,253,248,.72); color: var(--ink); }
  .k1 .dcard p { margin: 0 0 8px; font-size: 14.5px; line-height: 1.7; }
  .k1 .dcard ul, .k1 .dpanel ul, .k1 .dgrid ul, .k1 .dchat ul { margin: 0; padding: 0; list-style: none; }
  .k1 .dcard li, .k1 .dpanel li { display: flex; gap: 10px; padding: 6px 0; font-size: 14.5px; border-top: 1.5px dotted rgba(58,29,15,.18); }
  .k1 .dcard li::before, .k1 .dpanel li::before { content: ""; flex: none; width: 7px; height: 7px; margin-top: 9px; border-radius: 50%; background: var(--pink); }

  /* B · Chips — homepage shelf chips switch one cream card */
  .k1 .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 6px; }
  .k1 .chips::-webkit-scrollbar { display: none; }
  .k1 .chips button { flex: none; height: 38px; padding: 0 16px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--ink); background: var(--rice); font-family: var(--disp); font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .k1 .chips button:nth-child(3) { transform: rotate(-4deg); }
  .k1 .chips button[aria-selected="true"] { background: var(--royal); box-shadow: none; color: #fff; }
  .k1 .dpanel { border-radius: 24px; background: var(--paper); box-shadow: var(--soft); padding: 18px; animation: rise 260ms var(--ease-out) both; }
  .k1 .dpanel .top2 { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .k1 .dpanel .no { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: var(--royal); font-size: 15px; }

        <div class="cols"><a href="#">ফ্রেশ আম<i></i>→</a><a href="#">কল করুন<i></i>→</a><a href="#">হোমমেড<i></i>→</a><a href="#">হোয়াটসঅ্যাপ<i></i>→</a><a href="#">গুড়<i></i>→</a><a href="#">আমাদের গল্প<i></i>→</a></div>
        <span class="stamp">ক্যাশ অন<br>ডেলিভারি</span>
      </div><p class="copy">© ২০২৬ সেরা খাবার · রাজশাহী</p></footer>
      <div class="toast" role="status" aria-live="polite"><span>কার্টে রাখা হয়েছে ✓</span></div>
      <nav class="dock" aria-label="Dock"><span><i></i>হোম</span><span class="on"><i></i>পণ্য</span><span><i></i>খুঁজুন</span><span><i></i>মেনু</span></nav>
    </div>`;


  const SEC = [...P.sections, { l: "ডেলিভারি ও পেমেন্ট", d: P.delivery }];
  const COLORS = ["var(--sun)", "var(--rose)", "var(--royal)", "var(--butter)", "var(--card)"];
  const PHONE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>`;
  const head = `<div class="dh"><h2>বিস্তারিত</h2><span class="script">জেনে নিন</span></div>`;
  const list = (s) => `${s.b ? `<p>${s.b}</p>` : ""}<ul>${s.d.map((x) => `<li>${x}</li>`).join("")}</ul>`;
  const QUESTIONS = ["এই বড়ির বিশেষত্ব কী?", "এতে কী কী আছে?", "কীভাবে রান্না করবো?", "কীভাবে রাখবো?", "কবে পাবো, টাকা কীভাবে দেবো?"];
  const DETAILS = {
    cards: () => head + SEC.map((s, i) => `<div class="dcard" style="--c:${COLORS[i]}"${i === 2 ? " data-dark" : ""}><button class="press" data-acc aria-expanded="${i === 0}"><span class="no num">${two(i + 1)}</span><span class="t"><b>${s.l}</b><small>${s.d.slice(0, 2).join(" · ")}</small></span><em>+</em></button><div class="body"><div><div class="in">${list(s)}</div></div></div></div>`).join(""),
    chips: () => head + `<div class="chips" role="tablist">${SEC.map((s, i) => `<button class="press" role="tab" data-dtab="${i}" aria-selected="${i === 0}">${s.l}</button>`).join("")}</div><div data-dpanel></div>`,
    grid: () => head + `<div class="dgrid">${SEC.map((s, i) => `<article style="--c:${COLORS[i === 2 ? 0 : i]}"><span class="tag"><span class="num">${two(i + 1)}</span></span><h3>${s.l}</h3><ul>${s.d.map((x) => `<li>${x}</li>`).join("")}</ul></article>`).join("")}</div>`,
    chat: () => head + `<div class="dchat"><div class="ch-head"><span class="av"><img src="${MARK}" alt=""><i></i></span><span><b>সেরা খাবার</b><small>অনলাইন · সাধারণত কয়েক সেকেন্ডে উত্তর দেয়</small></span></div><div class="thread" data-dthread aria-live="polite"></div><div class="quick"><span>প্রশ্ন বেছে নিন</span><div>${QUESTIONS.map((q, i) => `<button class="press" data-dq="${i}" aria-pressed="${i === 0}">${q}</button>`).join("")}</div></div></div>`,
  };


  // Delivery estimate designs (real rules: Dhaka 1–2 days, outside Dhaka 2–3 days)
  const D = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
  const WEEK = ["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
  const rules = `ঢাকায় ১–২ দিন · ঢাকার বাইরে ২–৩ দিন`;
  const BOX = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>`;
  const DELIVERY = {
    ticket: () => `<div class="dl dl-ticket" role="group" aria-label="আনুমানিক ডেলিভারি"><div class="stub">${TRUCK}<b>আনুমানিক<br>ডেলিভারি</b></div><div class="body"><div class="steps">
        <div class="st"><i></i><b>অর্ডার</b><span class="num">আজ</span><em>${WEEK[D(0).getDay()]}</em></div>
        <div class="st"><i></i><b>প্রসেসিং</b><span class="num">${bn(D(1).getDate())}</span><em>${MONTHS[D(1).getMonth()]}</em></div>
        <div class="st"><i></i><b>আপনার হাতে</b><span class="num">${bn(D(2).getDate())}–${bn(D(3).getDate())}</span><em>${MONTHS[D(3).getMonth()]}</em></div>
      </div><small>${rules}</small></div></div>`,
    calendar: () => `<div class="dl dl-cal" role="group" aria-label="আনুমানিক ডেলিভারি"><div class="leaf"><div class="mon">${MONTHS[D(1).getMonth()]}</div><div class="d"><span class="num">${bn(D(1).getDate())}</span><em>–</em><span class="num">${bn(D(3).getDate())}</span></div><span class="wd">${WEEK[D(1).getDay()]} – ${WEEK[D(3).getDay()]}</span></div>
      <div class="txt"><span class="script">আজ অর্ডার করলে</span><b>আপনার দরজায় পৌঁছাবে</b><small>${rules}</small></div></div>`,
    road: () => `<div class="dl dl-road" role="group" aria-label="আনুমানিক ডেলিভারি"><div class="hd"><b>আনুমানিক ডেলিভারি</b><span class="script">সারা দেশে</span></div>
      <div class="lane"><span class="stop" style="left:6px;transform:none"></span><span class="stop" style="left:50%"></span><span class="stop end" style="left:auto;right:6px;transform:none"></span><span class="vroom">${TRUCK}</span></div>
      <div class="labels"><div><b>অর্ডার</b><span class="num">আজ</span></div><div><b>পথে</b><span class="num">${day(1)}</span></div><div><b>পৌঁছাবে</b><span class="num">${bn(D(2).getDate())}–${day(3)}</span></div></div></div>`,
    stamp: () => `<div class="dl dl-stamp" role="group" aria-label="আনুমানিক ডেলিভারি"><div class="ps"><div class="in">${BOX}<span class="num">${bn(D(1).getDate())}–${bn(D(3).getDate())}</span><small>${MONTHS[D(3).getMonth()]}</small></div><span class="pm">সারা<br>দেশে</span></div>
      <div class="txt"><b>আজ অর্ডার করলে<br><span class="num">${day(1)} – ${day(3)}</span>-এর মধ্যে পৌঁছাবে</b><small>${rules}</small></div></div>`,
  };

  const classic = (details, delivery) => chrome(`
      <div class="k1">
        <div class="top w">
          <div class="left rise">
            <div class="photo"><span class="chip">হোমমেড</span><span class="seal"><span><b>হাতে</b><b>তৈরি</b><small>রোদে শুকানো</small></span></span><img class="blend" src="${P.img}" alt="${P.bn}"></div>
            <div class="acc">${details}</div>
          </div>
          <div class="info rise">
            <h1>${P.bn}</h1>
            <span class="pill">রোদে শুকানো বড়ি · ১ কেজি / ২ কেজি</span>
            <span class="tagl script">মায়ের হাতের স্বাদ</span>
            <p class="lede">${P.lede}</p>
            <ul class="ticks">${P.ticks.map((t) => `<li>${t}</li>`).join("")}</ul>
            <span class="price num" data-price>${tk(P.sizes[0].p)}</span>
            <div><span class="lbl">সাইজ বেছে নিন</span><div class="sizes">${sizeBtns("size", (s, i) => `<span class="badge${i ? " pink" : ""}">${i ? `${tk(save)} সাশ্রয়` : "চেখে দেখুন"}</span><img src="${CUT}bori-cut.webp" alt=""><span><b>${s.t}</b><span class="num">${tk(s.p)}</span><small>প্রতি কেজি ${tk(Math.round(s.p / s.kg))}</small></span>`)}</div></div>
            ${delivery}
            <div class="buyrow">${qty}${cod("অর্ডার করুন")}</div>
            ${add()}
            <div class="or">অথবা</div>
            <div class="help"><a class="call press" href="#">${PHONE}ফোনে অর্ডার</a><a class="wa press" href="#"><img src="https://cdn.reicon.dev/logos/whatsapp/original.svg" alt="">হোয়াটসঅ্যাপে অর্ডার</a></div>
          </div>
        </div>
        <div class="strip" aria-hidden="true"><div>${Array(2).fill(["হাতে তৈরি", "রোদে শুকানো", "ক্যাশ অন ডেলিভারি", "সারাদেশে ডেলিভারি", "ঘরোয়া পদ্ধতি", "রাজশাহী থেকে"].map((x) => `<span>${x}</span>`).join("")).join("")}</div></div>
        <section class="more w"><div class="hh"><h2>আরও দেখুন</h2><span class="script">যা খুঁজছেন</span></div>${cards()}</section>
      </div>`);

  const variants = [
    () => classic(DETAILS.chips(), DELIVERY.ticket()),
    () => classic(DETAILS.chips(), DELIVERY.calendar()),
    () => classic(DETAILS.chips(), DELIVERY.road()),
    () => classic(DETAILS.chips(), DELIVERY.stamp()),
  ];

  const TABS = [
    { stats: [["উপাদান", "২ টি"], ["প্রস্তুতি", "হাতে"], ["শুকানো", "রোদে"]], text: P.sections[1].b },
    { stats: [["ভাজুন", "অল্প তেলে"], ["যোগ করুন", "১৫–২০ মি."], ["সাথে", "মাছ, সবজি"]], text: P.sections[2].b },
    { stats: [["ঢাকায়", "১–২ দিন"], ["ঢাকার বাইরে", "২–৩ দিন"], ["চার্জ", "৳১০০"]], text: "পেমেন্ট শুধু ক্যাশ অন ডেলিভারি। ৳২৬০০ বা তার বেশি অর্ডারে ডেলিভারি ফ্রি। পণ্যে সমস্যা হলে ডেলিভারির ২৪ ঘণ্টার মধ্যে জানান।" },
  ];

  // ── Page behaviour ──
  let cart = 0;
  function wire(root) {
    let size = 0, q = 1;
    const $$ = (s) => root.querySelectorAll(s);
    const update = () => {
      const s = P.sizes[size];
      $$("[data-size]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.size === size)));
      $$("[data-qv]").forEach((o) => (o.textContent = bn(q)));
      $$('[data-q="-1"]').forEach((b) => (b.disabled = q === 1));
      $$("[data-price]").forEach((e) => (e.textContent = tk(s.p * q)));
    };
    const toast = (msg) => { const t = root.querySelector(".toast"), sp = t.querySelector("span"); sp.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1600); };
    const tab = (i) => {
      $$("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(+b.dataset.tab === i)));
      const p = root.querySelector("[data-tabpanel]");
      if (p) p.innerHTML = `<div class="stats">${TABS[i].stats.map(([k, v]) => `<div><small>${k}</small><span class="num">${v}</span></div>`).join("")}</div><p class="tabtext">${TABS[i].text}</p>`;
    };
    const faq = (i) => {
      $$("[data-faq]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.faq === i)));
      const th = root.querySelector("[data-thread]");
      if (th) th.innerHTML = `<div class="bub me">${P.faqs[i][0]}</div><div class="bub shop">${P.faqs[i][1]}</div>`;
    };
    const dtab = (i) => {
      $$("[data-dtab]").forEach((b) => b.setAttribute("aria-selected", String(+b.dataset.dtab === i)));
      const p = root.querySelector("[data-dpanel]");
      const last = i === SEC.length - 1;
      if (p) p.innerHTML = `<div class="dmemo-w"><span class="tack"></span><div class="dmemo${last ? " has-stamp" : ""}">
        <div class="dmemo-top"><img src="${MARK}" alt=""><div class="dmemo-title"><b>${SEC[i].l}</b><span>${P.bn}</span></div><div class="dmemo-no">নং <span class="num">${two(i + 1)}</span><br>মোট ${two(SEC.length)}</div></div>
        ${SEC[i].b ? `<p>${SEC[i].b}</p>` : ""}
        <div class="dmemo-h">${last ? "জেনে রাখুন" : "যা থাকছে"}</div>
        ${SEC[i].d.map((x) => `<div class="dmemo-row"><span>${x}</span><em>✓</em></div>`).join("")}
        ${last ? `<div class="stampc" aria-hidden="true">ক্যাশ অন<br>ডেলিভারি<br>· সারা দেশে ·</div>` : ""}
      </div></div>`;
    };
    let typing;
    const dq = (i, instant) => {
      $$("[data-dq]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.dq === i)));
      const th = root.querySelector("[data-dthread]");
      if (!th) return;
      const answer = `<div class="bub shop">${list(SEC[i])}</div>`;
      clearTimeout(typing);
      const quiet = instant || matchMedia("(prefers-reduced-motion: reduce)").matches;
      th.innerHTML = `<div class="bub me">${QUESTIONS[i]}</div>` + (quiet ? answer : `<div class="bub shop typing" aria-label="লিখছে"><i></i><i></i><i></i></div>`);
      if (!quiet) typing = setTimeout(() => { th.lastElementChild.outerHTML = answer; }, 650);
    };
    root.addEventListener("click", (e) => {
      const t = e.target.closest("button, a");
      if (!t) return;
      if (t.tagName === "A") e.preventDefault();
      if (t.dataset.size) { size = +t.dataset.size; update(); }
      if (t.dataset.q) { q = Math.max(1, q + +t.dataset.q); update(); }
      if (t.dataset.tab) tab(+t.dataset.tab);
      if (t.dataset.faq) faq(+t.dataset.faq);
      if (t.dataset.dtab) dtab(+t.dataset.dtab);
      if (t.dataset.dq) dq(+t.dataset.dq);
      if (t.hasAttribute("data-acc")) t.setAttribute("aria-expanded", String(t.getAttribute("aria-expanded") !== "true"));
      if (t.hasAttribute("data-add")) {
        cart += q;
        const bag = root.querySelector("[data-bag]"); bag.textContent = bn(cart); bag.classList.remove("pulse"); void bag.offsetWidth; bag.classList.add("pulse");
        t.classList.add("added"); setTimeout(() => t.classList.remove("added"), 1400);
        toast("কার্টে রাখা হয়েছে ✓");
      }
      if (t.hasAttribute("data-cod")) toast("এখানে নতুন অর্ডার শিটটি খুলবে");
    });
    const rail = root.querySelector("[data-rail]"), track = root.querySelector("[data-track]");
    if (rail && track) {
      const sync = () => { const max = rail.scrollWidth - rail.clientWidth; const vis = rail.clientWidth / rail.scrollWidth; track.style.width = `${vis * 100}%`; track.style.transform = `translateX(${max > 0 ? (rail.scrollLeft / max) * ((1 / vis) - 1) * 100 : 0}%)`; };
      rail.addEventListener("scroll", sync, { passive: true }); sync();
    }
    tab(0); faq(0); dtab(0); dq(0, true); update();
  }

  // ── Stage mode ──
  const modeBtn = document.getElementById("mode");
  const setMode = (full) => { document.body.classList.toggle("full", full); modeBtn.textContent = full ? "Phone" : "Full width"; const u = new URL(location); u.searchParams.set("w", full ? "full" : "phone"); history.replaceState(null, "", u); };
  modeBtn.addEventListener("click", () => { setMode(!document.body.classList.contains("full")); mount(current); });
  setMode(new URLSearchParams(location.search).get("w") === "full");

  // ── Picker wiring: verbatim from PICKER.md; the mounted page is wrapped in .scroller and wired ──
  const stage = document.getElementById('stage');
  const picker = document.querySelector('.proto-picker');
  const highlight = picker.querySelector('.proto-picker-highlight');
  const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
  const replay = picker.querySelector('.proto-picker-replay');
  let current = 0;

  function moveHighlight() {
    const el = items[current];
    highlight.style.width = el.offsetWidth + 'px';
    highlight.style.transform = `translateX(${el.offsetLeft}px)`;
  }

  function mount(i) {
    stage.innerHTML = '';
    requestAnimationFrame(() => { stage.innerHTML = `<div class="scroller">${variants[i]()}</div>`; wire(stage.querySelector('.pg')); });
  }

  function setActive(i) {
    if (i < 0 || i >= variants.length) return;
    current = i;
    items.forEach((el, j) => {
      el.toggleAttribute('data-active', j === i);
      if (j === i) el.setAttribute('aria-current', 'true');
      else el.removeAttribute('aria-current');
    });
    moveHighlight();
    const url = new URL(location);
    url.searchParams.set('v', i + 1);
    history.replaceState(null, '', url);
    mount(i);
  }

  items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
  replay?.addEventListener('click', () => mount(current));
  window.addEventListener('resize', moveHighlight);

  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const num = parseInt(e.key, 10);
    if (num >= 1 && num <= variants.length) setActive(num - 1);
    else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
    else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
    else if (e.key === 'r' || e.key === 'R') mount(current);
  });

  setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

</script>
</body>
</html>
