# Supabase MCP for the Sera Khabar storefront repo.
#
# Read-only and scoped to the shared project. This repo only ever READS commerce
# data; product/schema writes belong in the Merchant Suite dashboard repo, whose
# own .mcp.json is not read-only. Keep this one read_only=true.
#
# Keep in sync with .mcp.json (Claude Code) — same project, same flags.
[mcp_servers.supabase]
url = "https://mcp.supabase.com/mcp?project_ref=xnuiaxygeoydtopvcmli&read_only=true&features=docs%2Cdatabase%2Cdebugging%2Cdevelopment"

[mcp_servers.sera-vercel]
url = "https://mcp.vercel.com"

[mcp_servers.sera-cloudflare]
url = "https://mcp.cloudflare.com/mcp"
